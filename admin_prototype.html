<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实验室管理后台 (labComputer) · 交互与最终 UI 定稿原型</title>
<style>
:root{
  --bg:#F3F5F8; --card:#FFFFFF; --sunken:#F8FAFC; --header:#0F172A; --sider:#FFFFFF;
  --fg:#1E293B; --fg2:#475569; --muted:#64748B; --line:#E2E8F0; --line2:#CBD5E1;
  --pri:#2F80ED; --pri-hover:#1D6FE8; --pri-soft:#EAF2FD;
  --ok:#27AE60; --ok-soft:#EAF7EF;
  --warn:#D97706; --warn-panel:#F2994A; --warn-soft:#FEF5EB;
  --bad:#EB5757; --bad-soft:#FDEDED;
  --f-sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","SF Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--f-sans);min-width:1340px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}

/* Top Review Bar (Engineering Review Helper) */
.rev-bar{height:36px;background:#1E293B;color:#E2E8F0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px;border-bottom:1px solid #334155}
.rev-grp{display:flex;align-items:center;gap:8px}
.rev-seg{display:inline-flex;background:#0F172A;border:1px solid #334155;border-radius:5px;overflow:hidden}
.rev-seg button{border:none;background:transparent;color:#94A3B8;padding:3px 9px;font-size:12px;cursor:pointer}
.rev-seg button.on{background:var(--pri);color:#fff;font-weight:600}
.rev-sel{background:#0F172A;color:#E2E8F0;border:1px solid #334155;border-radius:5px;padding:2px 6px;font-size:12px}

/* App Global Frame: Header 56px + Sider 208px + Main */
.app-header{height:56px;background:var(--header);color:#F8FAFC;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 1px 4px rgba(0,0,0,.16)}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:.02em}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.g-search{position:relative;width:360px}
.g-search input{width:100%;height:34px;border-radius:6px;border:1px solid #334155;background:#1E293B;color:#F8FAFC;padding:0 12px 0 32px;font-size:13px;outline:none}
.g-search input:focus{border-color:var(--pri)}
.g-search .ico{position:absolute;left:10px;top:8px;color:#94A3B8;font-size:13px}
.g-drop{position:absolute;left:0;right:0;top:40px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(15,23,42,.18);z-index:80;max-height:340px;overflow-y:auto}
.g-item{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:13px}
.g-item:hover{background:var(--sunken)}
.g-item:last-child{border-bottom:none}
.hdr-right{display:flex;align-items:center;gap:14px}
.online-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;background:#1E293B;border:1px solid #334155;cursor:pointer;font-size:12.5px;transition:border-color .15s}
.online-pill:hover{border-color:var(--pri)}
.user-chip{display:flex;align-items:center;gap:8px;font-size:13px;color:#E2E8F0}
.role-tag{font-size:11.5px;padding:1px 7px;border-radius:4px;background:rgba(47,128,237,.25);color:#93C5FD;border:1px solid rgba(47,128,237,.45)}

.app-body{display:flex;height:calc(100vh - 92px);min-height:640px}
.app-sider{width:208px;flex:none;background:var(--sider);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{height:38px;padding:0 12px;border-radius:7px;display:flex;align-items:center;justify-content:space-between;color:var(--fg2);cursor:pointer;font-size:13.5px;user-select:none}
.nav-item:hover{background:var(--sunken);color:var(--fg)}
.nav-item.active{background:var(--pri-soft);color:var(--pri);font-weight:600}
.nav-sep{height:1px;background:var(--line);margin:8px 6px}
.nav-badge{font:600 11px/1.4 var(--f-mono);padding:1px 6px;border-radius:999px;background:var(--bad-soft);color:var(--bad)}

.app-main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:16px 20px 36px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.page-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.page-hd h1{margin:0;font-size:19px;font-weight:600;display:flex;align-items:center;gap:10px}

/* Common UI Components (Element Plus Style) */
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.card-title{font-size:14.5px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between}
.btn{height:32px;padding:0 13px;border-radius:6px;border:1px solid var(--line2);background:#fff;color:var(--fg);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-hover);color:#fff}
.btn.danger{background:#fff;border-color:#FCA5A5;color:var(--bad)}
.btn.danger:hover{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed;pointer-events:none}

.inp,.sel,textarea.ta{border:1px solid var(--line2);border-radius:6px;padding:5px 10px;font-size:13px;background:#fff;outline:none}
.inp:focus,.sel:focus,textarea.ta:focus{border-color:var(--pri)}
.inp{height:32px}
.sel{height:32px}
textarea.ta{width:100%;resize:vertical;line-height:1.55}
.inp[readonly],.inp:disabled,textarea.ta[readonly]{background:var(--sunken);color:var(--muted)}

.filter-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.filter-left{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* Capsules & Badges (Aligned with Panel RGB565 Tokens) */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;display:inline-block}
.pill.idle{background:var(--ok-soft);color:var(--ok)}.pill.idle i{background:var(--ok)}
.pill.busy{background:var(--warn-soft);color:var(--warn)}.pill.busy i{background:var(--warn-panel)}
.pill.maint{background:var(--bad-soft);color:var(--bad)}.pill.maint i{background:var(--bad)}
.pill.proc{background:var(--pri-soft);color:var(--pri)}.pill.proc i{background:var(--pri)}
.pill.neutral{background:#F1F5F9;color:var(--muted)}.pill.neutral i{background:var(--muted)}

/* Tables */
.tbl-box{border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
th{background:var(--sunken);color:var(--muted);font-weight:600;font-size:12.5px}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFD}
.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.ops{display:flex;align-items:center;gap:8px}
.ops a{font-size:12.5px}
.ops a.del{color:var(--bad)}
.pager{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--sunken);border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

/* Tabs */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:9px 2px;cursor:pointer;color:var(--fg2);font-weight:500;position:relative}
.tab.active{color:var(--pri);font-weight:600}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--pri)}

/* Forms & Validation */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
.f-item{display:flex;flex-direction:column;gap:5px}
.f-item.full{grid-column:1/-1}
.f-lbl{font-size:13px;font-weight:500;color:var(--fg2);display:flex;align-items:center;justify-content:space-between}
.f-req::before{content:"* ";color:var(--bad)}
.f-cnt{font:11.5px var(--f-mono);color:var(--muted);font-weight:400}
.f-err{font-size:12px;color:var(--bad)}
.f-glyph{font-size:12px;color:#92400E;background:#FEF3C7;border:1px solid #FDE68A;border-radius:5px;padding:4px 9px}

/* Notifications & Modals */
.toast-stack{position:fixed;right:20px;top:104px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:380px}
.msg{padding:10px 14px;border-radius:8px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(15,23,42,.15);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;font-size:13px}
.msg.ok{border-left:4px solid var(--ok)}
.msg.err{border-left:4px solid var(--bad)}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:10px;border:1px solid var(--line);box-shadow:0 20px 48px rgba(15,23,42,.26);max-height:90vh;display:flex;flex-direction:column;width:640px;max-width:96vw}
.modal.lg{width:1020px}
.modal-hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600}
.modal-bd{padding:16px 18px;overflow-y:auto;flex:1}
.modal-ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:8px;background:var(--sunken);border-radius:0 0 10px 10px}

/* Transfer & Media Cards */
.transfer{display:grid;grid-template-columns:460px 76px minmax(0,1fr);gap:12px;align-items:stretch}
.tr-box{border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;height:410px;background:#fff}
.tr-hd{padding:10px 12px;background:var(--sunken);border-bottom:1px solid var(--line);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:space-between}
.tr-list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.tr-row{padding:7px 10px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;background:#fff}
.tr-row:hover{border-color:var(--pri)}
.media-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px}
.thumb-card{width:116px;height:82px;border-radius:6px;border:1px solid var(--line);overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:11.5px;text-align:center;padding:6px}
.layout-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.l-card{border:2px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;background:#fff;transition:border-color .15s}
.l-card.sel{border-color:var(--pri);background:#F8FBFF}
.prog-track{height:8px;border-radius:999px;background:#E2E8F0;overflow:hidden}
.prog-bar{height:100%;background:var(--pri);transition:width .25s}
</style>
</head>

    <a href="index.html" style="color:#93C5FD;margin-left:8px">← 返回设计总入口</a>

</div>

<div id="rootView"></div>
<div class="toast-stack" id="toastStack"></div>

/* Rare / Non-GB2312 glyph detector simulating POST /api/v1/text/check against wqyMicroHei.ttf */
function findMissingGlyphs(text){
  if(!text) return [];
  const rare = [];
  for(const ch of text){
    const cp = ch.codePointAt(0);
    /* Simulate wqyMicroHei coverage: CJK Ext-A/B+ (0x3400..0x4DBF, >=0x20000) or rare test chars */
    if((cp >= 0x3400 && cp <= 0x4DBF) || cp >= 0x20000 || '龘㵘𠀀喆镕'.includes(ch)){
      if(!rare.includes(ch)) rare.push(ch);
    }
  }
  return rare;
}

function labOfEquip(eqId){
  return DB.labs.find(l => l.equipIds.includes(eqId)) || null;
}
function panelOfLab(labId){
  return DB.panels.find(p => p.labId === labId) || null;
}
function labPubState(lab){
  const p = panelOfLab(lab.id);
  if(!p) return {k:'neutral', t:'未绑平板'};
  if(DB.publishJobs.find(j => j.lab === lab.name && j.status === '失败')) return {k:'maint', t:'发布失败'};
  if(lab.manifest_version > p.committedVer) return {k:'busy', t:`待发布 (v${p.committedVer}→v${lab.manifest_version})`};
  return {k:'idle', t:`已同步 v${lab.manifest_version}`};
}
function statusPill(st){
  const k = (st==='空闲'||st==='可用') ? 'idle' : st==='使用中' ? 'busy' : (st==='维护'||st==='停用') ? 'maint' : 'neutral';
  return `<span class="pill ${k}"><i></i>${esc(st)}</span>`;
}

function notify(text, kind='ok'){
  const box = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = `msg ${kind}`;
  el.innerHTML = `<span>${esc(text)}</span><a onclick="this.parentElement.remove()" style="color:var(--muted)">✕</a>`;
  box.appendChild(el);
  if(kind === 'ok') setTimeout(() => el.remove(), 2200);
}

}

function confirmBox(title, msg, dangerText, onConfirm){
  window.__confirmCb = () => { window.__closeModal(); onConfirm(); };
  openModal(title, `<p style="margin:4px 0;font-size:14px;line-height:1.65">${msg}</p>`,
    `<button class="btn" onclick="window.__closeModal()">取消</button>
     <button class="btn ${dangerText.includes('删除')||dangerText.includes('解绑')||dangerText.includes('恢复')?'danger':'pri'}" onclick="window.__confirmCb()">${dangerText}</button>`);
}

function navigate(route, opts={}){
  const go = () => {
    S.isDirty = false;
    S.route = route;
    Object.assign(S, opts);
    syncHash();
    render();
  };
  if(S.isDirty){
    confirmBox('离开未保存的页面', '当前表单有未保存的修改，离开后修改将丢失，是否确认离开？', '放弃修改并离开', go);
  } else go();
}
window.__nav = navigate;

function syncHash(){
  const q = new URLSearchParams();
  if(S.route === 'labs'){
    if(S.labFilter.status) q.set('status', S.labFilter.status);
    if(S.labFilter.pub) q.set('pub', S.labFilter.pub);
  } else if(S.route === 'panels' && S.panelFilter.online !== ''){
    q.set('online', S.panelFilter.online);
  }
  const qs = q.toString();
  history.replaceState(null, '', `#/${S.route}${qs ? '?' + qs : ''}`);
}

/* ==================== 2. Proportional Layout Region Schematic SVG (Spec §4.5) ==================== */
function renderLayoutSchematicSVG(lay, w=156, h=104){
  const pad = 6;
  const sc = Math.min((w - pad*2) / lay.w, (h - pad*2) / lay.h);
  const rw = lay.w * sc, rh = lay.h * sc;
  const ox = (w - rw) / 2, oy = (h - rh) / 2;
  const palette = {
    video:  ['#DBEAFE','#2563EB','视频'],
    title:  ['#FEF3C7','#D97706','标题'],
    cards:  ['#DCFCE7','#16A34A','卡片'],
    notice: ['#F1F5F9','#475569','须知']
  };
  const rects = lay.regions.map(r => {
    const [fill, stroke, cn] = palette[r.id] || ['#E2E8F0','#64748B',r.id];
    const x = ox + r.x*sc, y = oy + r.y*sc, bw = r.w*sc, bh = r.h*sc;
    return `<g>
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/>
      ${bh >= 13 ? `<text x="${(x+bw/2).toFixed(1)}" y="${(y+bh/2+3.5).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="${stroke}" font-weight="600">${cn}</text>` : ''}
    </g>`;
  }).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="background:#F8FAFC;border-radius:6px;border:1px solid var(--line);display:block">
    <rect x="${ox.toFixed(1)}" y="${oy.toFixed(1)}" width="${rw.toFixed(1)}" height="${rh.toFixed(1)}" fill="#0F172A" rx="2"/>
    ${rects}
  </svg>`;
}

        <div style="padding:14px;border-radius:8px;background:var(--ok-soft);color:#14532D;font-size:13.5px;line-height:1.7">
          ✅ 服务已就绪（数据目录：<code>C:\\ProgramData\\labComputer</code>）。<br>

}

      <div style="display:flex;flex-direction:column;gap:8px">

          <div><span class="pill maint"><i></i>平板离线</span> <strong style="margin-left:8px">${esc(p.name)} (${p.ip})</strong> <span style="color:var(--muted);margin-left:8px">最后在线 ${p.lastSeen} · ${esc(p.lastErr)}</span></div>
          <a>去处理 →</a>

/* 4.2 Labs List & 4-Tab Lab Editor */
function renderLabs(){
  const list = DB.labs.filter(l => {
    if(S.labFilter.status && l.status !== S.labFilter.status) return false;
    const ps = labPubState(l);
    if(S.labFilter.pub === 'pending' && !ps.t.startsWith('待发布')) return false;
    if(S.labFilter.pub === 'synced' && !ps.t.startsWith('已同步')) return false;
    if(S.labFilter.pub === 'failed' && ps.t !== '发布失败') return false;
    if(S.labFilter.kw && !(l.name+l.code+l.owner).includes(S.labFilter.kw)) return false;
    return true;
  });

  return `
    <div class="page-hd">
      <h1>实验室管理</h1>
      <div style="display:flex;gap:8px">
        ${canEdit() ? `<button class="btn" onclick="window.__batchPublish()">批量发布已选 (${S.selectedLabIds.length})</button>
        <button class="btn pri" onclick="window.__createLab()">+ 新建实验室</button>` : ''}
      </div>
    </div>
    <div class="filter-bar">
      <div class="filter-left">
        <select class="sel" onchange="window.__setLabFilter('status',this.value)">
          <option value="">全部运行状态</option>
          ${['空闲','使用中','维护'].map(s=>`<option value="${s}" ${S.labFilter.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <select class="sel" onchange="window.__setLabFilter('pub',this.value)">
          <option value="">全部发布状态</option>
          <option value="pending" ${S.labFilter.pub==='pending'?'selected':''}>待发布</option>
          <option value="synced" ${S.labFilter.pub==='synced'?'selected':''}>已同步</option>
          <option value="failed" ${S.labFilter.pub==='failed'?'selected':''}>发布失败</option>
        </select>
        <input class="inp" placeholder="搜索编号 / 实验室名称 / 负责人" value="${esc(S.labFilter.kw)}" oninput="window.__setLabFilter('kw',this.value)" style="width:230px">
      </div>
      <span style="font-size:12px;color:var(--muted)">筛选条件已同步至 URL 查询参数</span>
    </div>
    <div class="tbl-box">
      <table>
        <thead><tr>
          <th style="width:36px"><input type="checkbox" onchange="window.__toggleAllLabs(this.checked)"></th>
          <th style="width:92px">编号</th>
          <th style="width:180px">名称</th>
          <th style="width:130px">位置</th>
          <th style="width:94px">状态</th>
          <th style="width:70px">设备数</th>
          <th style="width:160px">绑定平板</th>
          <th style="width:146px">发布状态</th>
          <th style="width:136px">更新时间</th>
          <th style="width:140px">操作</th>
        </tr></thead>
        <tbody>
          ${list.map(l => {
            const p = panelOfLab(l.id);
            const ps = labPubState(l);
            return `<tr>
              <td><input type="checkbox" ${S.selectedLabIds.includes(l.id)?'checked':''} onchange="window.__toggleLabSel('${l.id}',this.checked)"></td>
              <td class="mono">${esc(l.code)}</td>
              <td><a onclick="window.__nav('lab-edit',{editLabId:'${l.id}',editLabTab:'basic'})"><strong>${esc(l.name)}</strong></a></td>
              <td>${esc(l.bld+' '+l.flr+' '+l.rm)}</td>
              <td>${statusPill(l.status)}</td>
              <td class="mono">${l.equipIds.length} 台</td>

              <td><span class="pill ${ps.k}"><i></i>${ps.t}</span></td>
              <td class="mono">${l.updated}</td>
              <td><div class="ops">
                <a onclick="window.__nav('lab-edit',{editLabId:'${l.id}',editLabTab:'basic'})">${canEdit()?'编辑':'查看'}</a>
                ${canEdit() ? `<a onclick="window.__nav('lab-edit',{editLabId:'${l.id}',editLabTab:'publish'})">发布</a>
                <a class="del" onclick="window.__deleteLab('${l.id}')">删除</a>` : ''}
              </div></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      <div class="pager"><span>共 ${list.length} 条记录 · 每页 20 条（服务端排序）</span><span>第 1 / 1 页</span></div>
    </div>`;
}

function glyphHintHTML(val){
  const miss = findMissingGlyphs(val);
  if(!miss.length) return '';
  return `<div class="f-glyph">⚠️ 以下字在平板字库 (wqyMicroHei) 中缺失，在平板上会显示为方框：<strong>${miss.join('、')}</strong>（仅提示，不阻止保存）</div>`;
}

  return `

        `<div class="tab ${S.editLabTab===k?'active':''}" onclick="window.__setLabTab('${k}')">${t}</div>`).join('')}

}

/* ==================== 5. Master Shell Render ==================== */
function render(){
  const root = document.getElementById('rootView');
  if(S.mode !== 'app'){ root.innerHTML = renderSetupOrLogin(); return; }

  const onlineCnt = DB.panels.filter(p => p.online).length;
  const offlineCnt = DB.panels.length - onlineCnt;

  /* Global Search Dropdown */
  let searchDrop = '';
  if(S.searchKw.trim()){
    const kw = S.searchKw.trim().toLowerCase();
    const hits = [];
    DB.labs.forEach(l => { if((l.name+l.code).toLowerCase().includes(kw)) hits.push({t:`[实验室] ${l.code} · ${l.name}`, fn:`window.__pickSearch('lab-edit',{editLabId:'${l.id}',editLabTab:'basic'})`}); });
    DB.equipment.forEach(e => { if((e.name+e.asset_no+e.model).toLowerCase().includes(kw)) hits.push({t:`[试验设备] ${e.asset_no} · ${e.name}`, fn:`window.__pickSearch('equip-edit',{editEqId:'${e.id}'})`}); });
    DB.panels.forEach(p => { if((p.name+p.sn+p.ip).toLowerCase().includes(kw)) hits.push({t:`[门口平板] ${p.name} (${p.ip})`, fn:`window.__pickSearch('panels',{panelFilter:{online:''}})`}); });
    searchDrop = `<div class="g-drop">${hits.slice(0,10).map(h=>`<div class="g-item" onclick="${h.fn}"><span>${esc(h.t)}</span><span style="color:var(--pri)">跳转 →</span></div>`).join('') || `<div class="g-item" style="color:var(--muted)">无匹配结果</div>`}</div>`;
  }

  let mainBody = '';
  if(S.route === 'overview') mainBody = renderOverview();
  else if(S.route === 'labs') mainBody = renderLabs();
  else if(S.route === 'lab-edit') mainBody = renderLabEdit();
  else if(S.route === 'equipment') mainBody = renderEquipment();
  else if(S.route === 'equip-edit') mainBody = renderEquipEdit();
  else if(S.route === 'media') mainBody = renderMediaLib();
  else if(S.route === 'panels') mainBody = renderPanels();
  else if(S.route === 'publish-jobs') mainBody = renderPublishJobs();
  else mainBody = renderAdminSystemPage();

  const roleLabel = {admin:'管理员', editor:'编辑', viewer:'只读'}[S.role];
  const userLabel = {admin:'admin', editor:'zhang', viewer:'guest'}[S.role];

  root.innerHTML = `
    <header class="app-header">
      <div class="brand"><div class="brand-mark">L</div><span>实验室管理后台</span></div>
      <div class="g-search">
        <span class="ico">🔍</span>
        <input placeholder="全局搜索实验室 / 设备 / 平板（300ms 防抖，最多 10 条）" value="${esc(S.searchKw)}" oninput="window.__onGlobalSearch(this.value)">
        ${searchDrop}
      </div>
      <div class="hdr-right">
        <div class="online-pill" onclick="window.__nav('panels',{panelFilter:{online:'0'}})" title="点击跳转平板列表并自动筛选离线平板">
          <span style="color:${offlineCnt?'#F87171':'#4ADE80'}">●</span>
          <span>平板在线 <strong>${onlineCnt} / ${DB.panels.length}</strong></span>
        </div>
        <div class="user-chip"><span class="role-tag">${roleLabel}</span><span>${userLabel} ▾</span></div>
      </div>
    </header>
    <div class="app-body">
      <aside class="app-sider">
        ${[
          ['overview','概览',''],
          ['labs','实验室',''],
          ['equipment','试验设备',''],
          ['media','媒体库',''],
          ['panels','平板', offlineCnt ? String(offlineCnt) : ''],
          ['publish-jobs','发布记录','']
        ].map(([r,lbl,bdg]) => `<div class="nav-item ${(S.route===r||(r==='labs'&&S.route==='lab-edit')||(r==='equipment'&&S.route==='equip-edit'))?'active':''}" onclick="window.__nav('${r}')">
          <span>${lbl}</span>${bdg?`<span class="nav-badge">${bdg}</span>`:''}
        </div>`).join('')}

        ${isAdmin() ? `
          <div class="nav-sep"></div>
          ${[['users','账号'],['audit','审计日志'],['backups','备份'],['settings','系统设置']].map(([r,lbl]) =>
            `<div class="nav-item ${S.route===r?'active':''}" onclick="window.__nav('${r}')"><span>${lbl}</span></div>`).join('')}
        ` : ''}
      </aside>
      <main class="app-main">${mainBody}</main>

let searchTimer = null;

};
window.__pickSearch = (route, opts) => { S.searchKw = ''; navigate(route, opts); };
window.__setMode = m => { S.mode = m; S.setupStep = 1; render(); };

window.__setLabFilter = (k, v) => { S.labFilter[k] = v; syncHash(); render(); };
window.__toggleLabSel = (id, on) => {
  if(on && !S.selectedLabIds.includes(id)) S.selectedLabIds.push(id);
  if(!on) S.selectedLabIds = S.selectedLabIds.filter(x => x !== id);
  render();
};
window.__toggleAllLabs = on => { S.selectedLabIds = on ? DB.labs.map(l => l.id) : []; render(); };
window.__batchPublish = () => {
  if(!S.selectedLabIds.length){ notify('请先在左侧勾选要批量发布的实验室', 'err'); return; }

};

  confirmBox('确认删除实验室', `删除实验室「${esc(l.name)}（${esc(l.code)}）」后，其下的 ${l.equipIds.length} 台试验设备将变为“未分配”状态（设备档案保留）。是否确认删除？`, '确认删除', () => {

    render();
  });
};

window.__setLabTab = t => { S.editLabTab = t; S.previewEquipDetailId = null; render(); };
window.__updLab = (k, v) => {
  const lab = DB.labs.find(x => x.id === S.editLabId);
  lab[k] = v; S.isDirty = true; render();
};
window.__injectRareChar = () => {
  const lab = DB.labs.find(x => x.id === S.editLabId);
  if(!lab.name.includes('㵘')) lab.name = (lab.name.slice(0,22) + '·㵘流测试');
  S.isDirty = true; render();
};
window.__updSafety = (idx, v) => { DB.labs.find(x=>x.id===S.editLabId).safety[idx] = v; S.isDirty = true; };
window.__moveSafety = (idx, dir) => {
  const arr = DB.labs.find(x=>x.id===S.editLabId).safety;
  const ni = idx + dir; if(ni < 0 || ni >= arr.length) return;
  [arr[idx], arr[ni]] = [arr[ni], arr[idx]]; S.isDirty = true; render();
};
window.__delSafety = idx => { DB.labs.find(x=>x.id===S.editLabId).safety.splice(idx,1); S.isDirty = true; render(); };
window.__addSafety = () => { DB.labs.find(x=>x.id===S.editLabId).safety.push('实验期间严禁饮食与无关人员逗留'); S.isDirty = true; render(); };
window.__saveLab = () => {

/* Equipment Transfer & Cross-Lab Move Confirmation (Spec §4.2 Tab 2) */
window.__toggleOtherEq = on => { S.showOtherLabEq = on; render(); };
window.__addEqToLab = eqId => {
  const targetLab = DB.labs.find(x => x.id === S.editLabId);
  if(targetLab.equipIds.length >= 60){ notify('单个实验室最多组合 60 台设备', 'err'); return; }
  const eq = DB.equipment.find(e => e.id === eqId);
  const srcLab = labOfEquip(eqId);
  if(srcLab && srcLab.id !== targetLab.id){
    confirmBox('确认跨实验室调拨设备',
      `将把「<strong>${esc(eq.name)}（${esc(eq.asset_no)}）</strong>」从「<strong>${esc(srcLab.name)}</strong>」移到本实验室「<strong>${esc(targetLab.name)}</strong>」，两个实验室的清单版本都会加一，且<strong>两个实验室都需要重新发布</strong>。`,
      '确认移动', () => {
        srcLab.equipIds = srcLab.equipIds.filter(id => id !== eqId);
        srcLab.manifest_version++;
        targetLab.equipIds.push(eqId);
        targetLab.manifest_version++;
        DB.history.unshift({time:'2026-11-17 21:09', user:'admin', action:`从 ${srcLab.code} 移入 ${targetLab.code}`, equip:eq.name});
        notify(`已完成调拨，「${srcLab.name}」与「${targetLab.name}」均已标记为待发布`);
        render();
      });
  } else {
    targetLab.equipIds.push(eqId);
    targetLab.manifest_version++;
    notify(`已将「${eq.name}」加入本实验室`);
    render();
  }
};
window.__removeEqFromLab = eqId => {
  const lab = DB.labs.find(x => x.id === S.editLabId);
  lab.equipIds = lab.equipIds.filter(id => id !== eqId);
  lab.manifest_version++;
  notify('已从本实验室移除该设备（设备本身未删除，现为未分配状态）');
  render();
};
window.__reorderLabEq = (idx, dir) => {
  const arr = DB.labs.find(x => x.id === S.editLabId).equipIds;
  const ni = idx + dir; if(ni < 0 || ni >= arr.length) return;

  render();
};

      render(); return;

    S.pubStepText = '步骤 2/3：原子提交 commit v' + lab.manifest_version + ' 并清理无用素材…'; S.pubProgress = 88; render();

  S.pubStepText = '断点续传：GET files 校验通过，已自动跳过前 2 个文件，续传第 3/3 个文件…'; S.pubProgress = 82; render();

};

window.__runBackupNow = () => { DB.backups.unshift({id:'B'+Date.now(),name:'labComputer-backup-manual.zip',time:'2026-11-17 21:08',size:'185.1 MB',kind:'手动备份 (admin)'}); notify('后台备份任务已完成'); render(); };
window.__restoreBackup = id => {
  const b = DB.backups.find(x => x.id === id);
  confirmBox('确认从备份恢复', `从「${esc(b.name)}」恢复将覆盖当前数据库并自动重启 Windows 服务。是否继续？`, '确认恢复并重启', () => notify('服务正在恢复并重启…'));
};
window.__updEqField = (k, v) => { DB.equipment.find(x=>x.id===S.editEqId)[k] = v; S.isDirty = true; if(k==='name') render(); };
window.__saveEquip = () => {
  const ol = labOfEquip(S.editEqId);
  S.isDirty = false;
  if(ol) ol.manifest_version++;
  notify('设备档案已保存' + (ol ? '，所属实验室清单版本已 +1' : ''));
  render();
};
window.__updSpec = (i, col, v) => { DB.equipment.find(x=>x.id===S.editEqId).specs[i][col] = v; S.isDirty = true; };
window.__delSpec = i => { DB.equipment.find(x=>x.id===S.editEqId).specs.splice(i,1); S.isDirty = true; render(); };
window.__addSpec = () => { DB.equipment.find(x=>x.id===S.editEqId).specs.push(['','']); S.isDirty = true; render(); };
window.__deleteEquip = id => {
  const e = DB.equipment.find(x => x.id === id);
  const ol = labOfEquip(id);
  confirmBox('确认删除试验设备',
    `删除设备「<strong>${esc(e.name)}</strong>」后${ol ? `，它会从「<strong>${esc(ol.name)}</strong>」移除，下次发布时门口平板上也会消失` : '，该设备档案将被永久移除'}。是否确认删除？`,
    '确认删除', () => {
      DB.equipment = DB.equipment.filter(x => x.id !== id);
      if(ol){ ol.equipIds = ol.equipIds.filter(x => x !== id); ol.manifest_version++; }
      notify(`已删除设备「${e.name}」`); render();
    });
};

        <tr><td class="mono">#3</td><td class="mono">ZC-2024-0108</td><td>万能试验机（重复）</td><td class="mono">WAW-600</td><td><span class="pill maint"><i></i>资产编号已存在</span></td></tr>
        <tr><td class="mono">#4</td><td class="mono">ZC-2026-0305</td><td>旋转弯曲疲劳机</td><td class="mono">PQ-6</td><td><span class="pill idle"><i></i>校验通过</span></td></tr>
      </tbody>

    `<button class="btn" onclick="window.__closeModal()">取消</button>
     <button class="btn pri" onclick="window.__closeModal();window.__notify('成功导入 2 台通过校验的试验设备')">确认导入通过的 2 行</button>`);
};

/* Panel Scan, 4-Step Bind Wizard, Set Layout Modal, Screenshot, OTA */
window.__openScanModal = () => {
  openModal('扫描局域网网段查找平板 (/api/v1/panels/scan)', `
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input class="inp mono" value="192.168.10.0/24" style="flex:1">
      <button class="btn" onclick="window.__notify('已停止网段扫描')">停止扫描</button>
    </div>
    <div style="margin-bottom:10px;font-size:12.5px;color:var(--muted)">扫描进度：254 / 254 地址已完成 · 发现 2 台尚未登记的新平板：</div>
    <div class="tbl-box"><table>
      <thead><tr><th style="width:38px"><input type="checkbox" checked></th><th>IP 地址</th><th>SN 序列号</th><th>固件版本</th><th>状态</th></tr></thead>
      <tbody>
        <tr><td><input type="checkbox" checked></td><td class="mono">192.168.10.212</td><td class="mono">HL-LP9868-26110212</td><td class="mono">1.0.0+ae79616f</td><td><span class="pill busy"><i></i>出厂默认密码</span></td></tr>
        <tr><td><input type="checkbox" checked></td><td class="mono">192.168.10.215</td><td class="mono">HL-LP9868-26110215</td><td class="mono">1.0.0+ae79616f</td><td><span class="pill busy"><i></i>出厂默认密码</span></td></tr>
      </tbody>
    </table></div>`,
    `<button class="btn" onclick="window.__closeModal()">关闭</button>
     <button class="btn pri" onclick="window.__closeModal();window.__openBindWizard('192.168.10.212')">勾选添加并进入绑定向导 →</button>`);
};

let wiz = {step:1, ip:'192.168.10.212', pwdMode:'auto', labId:'L4', layout:'landscape_std'};
window.__wizSet = (k, v) => { wiz[k] = v; renderBindWizardModal(); };
window.__wizStep = d => { wiz.step += d; renderBindWizardModal(); };
window.__openBindWizard = (ip='192.168.10.212') => {
  wiz = {step:1, ip, pwdMode:'auto', labId:'', layout:'landscape_std'};
  renderBindWizardModal();
};
function renderBindWizardModal(){
  const steps = ['1. 确认平板信息','2. 修改默认密码','3. 绑定实验室','4. 选择布局并首次发布'];
  const headBar = `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px">
    ${steps.map((s,i)=>`<div style="padding:7px 10px;border-radius:6px;font-size:12px;font-weight:600;background:${wiz.step===i+1?'var(--pri-soft)':'var(--sunken)'};color:${wiz.step===i+1?'var(--pri)':'var(--muted)'}">${s}</div>`).join('')}
  </div>`;

  let body = '';
  if(wiz.step === 1){
    body = `<div class="form-grid">
      <div class="f-item"><label class="f-lbl">平板 IP 地址（点击读取 info）</label><input class="inp mono" value="${esc(wiz.ip)}"></div>
      <div class="f-item"><label class="f-lbl">序列号 SN</label><input class="inp mono" value="HL-LP9868-26110212" readonly></div>
      <div class="f-item"><label class="f-lbl">MAC 地址</label><input class="inp mono" value="00:E0:4C:98:68:89" readonly></div>
      <div class="f-item"><label class="f-lbl">固件与屏幕规格</label><input class="inp mono" value="1.0.0+ae79616f · 1280×800 触摸屏" readonly></div>
    </div>`;
  } else if(wiz.step === 2){
    body = `<div class="f-glyph" style="margin-bottom:12px">🔒 安全强制要求：检测到该平板仍使用出厂默认密码（<code>default_password: true</code>），绑定前必须修改设备独立密码。</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <label style="cursor:pointer"><input type="radio" name="pm" ${wiz.pwdMode==='auto'?'checked':''} onchange="window.__wizSet('pwdMode','auto')"> <strong>由后台随机生成 16 位强密码并 AES-GCM 加密托管（推荐）</strong></label>
        <label style="cursor:pointer"><input type="radio" name="pm" ${wiz.pwdMode==='manual'?'checked':''} onchange="window.__wizSet('pwdMode','manual')"> 手动输入设备密码</label>
        ${wiz.pwdMode==='manual' ? `<input class="inp" type="password" placeholder="输入 8-32 位新设备密码（保存后界面不再显示明文）">` : ''}
      </div>`;
  } else if(wiz.step === 3){
    const chosenPanel = wiz.labId ? panelOfLab(wiz.labId) : null;
    body = `<div class="f-item">
      <label class="f-lbl f-req">选择要绑定的实验室（一间实验室同一时间只绑定一台平板）</label>
      <select class="sel" onchange="window.__wizSet('labId',this.value)">
        <option value="">-- 请选择实验室 --</option>
        ${DB.labs.map(l => {
          const p = panelOfLab(l.id);
          return `<option value="${l.id}" ${wiz.labId===l.id?'selected':''}>${esc(l.code)} · ${esc(l.name)} ${p?`（已绑定 ${p.name}）`:'（未绑定 · 可直接选）'}</option>`;
        }).join('')}
      </select>
      ${chosenPanel ? `<div class="f-glyph" style="margin-top:8px">⚠️ 该实验室已绑定平板「${esc(chosenPanel.name)}」，请先在平板列表中解绑原平板后再绑定，或新建其他实验室。</div>` : ''}
    </div>`;
  } else {
    body = `<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">以下布局列表由平板 <code>layouts</code> 接口实时返回，区块示意图按 <code>regions</code> 逻辑坐标等比例绘制：</div>
      <div class="layout-cards">
        ${LAYOUT_DEFS.map(d => `<div class="l-card ${wiz.layout===d.id?'sel':''}" onclick="window.__wizSet('layout','${d.id}')">
          ${renderLayoutSchematicSVG(d, 260, 120)}
          <div style="margin-top:8px;display:flex;align-items:center;justify-content:space-between">
            <strong>${esc(d.name)}</strong>
            <span class="pill neutral">${d.orientation==='portrait'?'竖屏 800×1280':'横屏 1280×800'}</span>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(d.desc)}</div>
        </div>`).join('')}
      </div>`;
  }

  openModal('平板绑定向导（4 步完成改密、选布局与首次发布）', headBar + body, `
    ${wiz.step > 1 ? `<button class="btn" onclick="window.__wizStep(-1)">上一步</button>` : `<button class="btn" onclick="window.__closeModal()">取消</button>`}
    ${wiz.step < 4 ? `<button class="btn pri" onclick="window.__wizStep(1)">下一步</button>`
      : `<button class="btn pri" onclick="window.__closeModal();window.__notify('已完成设备改密、布局设置，并自动启动首次清单发布任务！')">完成并首次发布</button>`}`, true);
}

window.__openSetLayoutModal = panelId => {
  const p = DB.panels.find(x => x.id === panelId);
  const lab = DB.labs.find(l => l.id === p.labId) || DB.labs[0];
  let picked = p.layout;
  const draw = () => {
    openModal(`设置平板布局 · ${esc(p.name)} (${p.ip})`, `
      <div style="display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start">
        <div style="display:flex;flex-direction:column;gap:10px">
          ${LAYOUT_DEFS.map(d => `<div class="l-card ${picked===d.id?'sel':''}" onclick="window.__pickModalLayout('${d.id}')" style="display:flex;gap:10px;align-items:center">
            ${renderLayoutSchematicSVG(d, 118, 82)}
            <div style="min-width:0">
              <div style="font-weight:600">${esc(d.name)} ${p.layout===d.id?'<span style="color:var(--pri);font-size:11.5px">(当前)</span>':''}</div>
              <div style="font-size:11.5px;color:var(--muted);margin:2px 0">${d.orientation==='portrait'?'竖屏 800×1280':'横屏 1280×800'}</div>
              <div style="font-size:11.5px;color:var(--fg2)">${esc(d.desc)}</div>
            </div>
          </div>`).join('')}
        </div>
        <div style="border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--sunken)">
          <div style="font-size:12.5px;font-weight:600;margin-bottom:8px">WASM 实时效果预览（当前生效清单 + 所选布局）</div>
          ${renderEmbeddedPanelPreview(lab, picked)}
        </div>
      </div>`,
      `<button class="btn" onclick="window.__closeModal()">取消</button>
       <button class="btn pri" onclick="window.__applyPanelLayout('${p.id}','${picked}')">应用布局 (set_layout)</button>`, true);
  };
  window.__pickModalLayout = id => { picked = id; draw(); };
  draw();
};
window.__applyPanelLayout = (panelId, layId) => {
  const p = DB.panels.find(x => x.id === panelId);
  const lay = LAYOUT_DEFS.find(d => d.id === layId);
  p.layout = layId;
  window.__closeModal();
  notify(`平板已切换为「${lay.name}」（无需重发素材，3 秒内热重建完成）`);
  render();
};

window.__openScreenshotModal = panelId => {
  const p = DB.panels.find(x => x.id === panelId);
  const lab = DB.labs.find(l => l.id === p.labId) || DB.labs[0];
  openModal(`平板实时屏幕截图 · ${esc(p.name)} (${p.ip})`, `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12.5px;color:var(--muted)">
      <span>GET /lab/lab.cgi?action=screenshot&quality=80 · 截取时间：2026-11-17 21:09:12</span>
      <button class="btn sm" onclick="window.__notify('已重新请求平板实时 JPEG 截图')">↻ 刷新截图</button>
    </div>
    ${renderEmbeddedPanelPreview(lab, p.layout)}`,
    `<button class="btn pri" onclick="window.__closeModal()">关闭</button>`, true);
};

window.__openOtaModal = panelId => {
  const p = DB.panels.find(x => x.id === panelId);
  openModal(`固件 OTA 升级 · ${esc(p.name)}`, `
    <div class="form-grid">
      <div class="f-item"><label class="f-lbl">当前固件版本</label><input class="inp mono" value="${esc(p.fw)}" readonly></div>
      <div class="f-item"><label class="f-lbl">选择固件升级包 (ITEPKG03.PKG)</label><input class="inp" type="file"></div>
    </div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:12px">流程：先调用 <code>upload_pkg</code> 上传校验，再调用 <code>pkg_upgrade</code> 重启烧录，恢复后自动核对同 SN 与新版本号。</p>`,
    `<button class="btn" onclick="window.__closeModal()">取消</button><button class="btn pri" onclick="window.__closeModal();window.__notify('OTA 升级包已加入推送任务')">开始升级</button>`);
};

window.__rebootPanel = id => {
  const p = DB.panels.find(x => x.id === id);
  confirmBox('确认重启门口平板', `将向平板「${esc(p.name)} (${p.ip})」发送 <code>reboot</code> 指令，屏幕将短暂黑屏约 8 秒后恢复。是否确认重启？`, '确认重启', () => notify(`重启指令已发送至 ${p.ip}`));
};
window.__unbindPanel = id => {
  const p = DB.panels.find(x => x.id === id);
  confirmBox('确认解绑平板', `解绑平板「${esc(p.name)}」后，它与实验室的关联将解除，后续后台修改不再推送到该平板。是否确认解绑？`, '确认解绑', () => { p.labId = ''; notify('已解绑平板'); render(); });
};

window.__openJobLog = id => {
  const j = DB.publishJobs.find(x => x.id === id);
  openModal(`发布任务分步日志 · ${j.id} (${esc(j.lab)})`, `
    <div style="background:#0F172A;color:#E2E8F0;border-radius:8px;padding:14px;font:12.5px/1.7 var(--f-mono)">
      ${j.logs.map(l => `<div style="color:${l.includes('失败')?'#FCA5A5':'#CBD5E1'}">${esc(l)}</div>`).join('')}
    </div>`, `<button class="btn pri" onclick="window.__closeModal()">关闭</button>`);
};
window.__retryJob = id => {
  const j = DB.publishJobs.find(x => x.id === id);
  j.status = '成功'; j.logs.push('[21:09:30] 手动重试：已跳过 1 个已上传文件，续传完成并 commit 成功');
  notify('重试成功：已自动跳过已上传文件并完成提交'); render();
};

window.__openAuditDiff = id => {
  const a = DB.audits.find(x => x.id === id);
  openModal(`审计日志修改前后对比 · ${esc(a.target)}`, `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div><div style="font-weight:600;margin-bottom:6px;color:var(--bad)">修改前 (Before)</div><pre style="margin:0;padding:12px;border-radius:6px;background:#FEF2F2;font:12px/1.5 var(--f-mono);white-space:pre-wrap">${esc(a.before)}</pre></div>
      <div><div style="font-weight:600;margin-bottom:6px;color:var(--ok)">修改后 (After)</div><pre style="margin:0;padding:12px;border-radius:6px;background:#F0FDF4;font:12px/1.5 var(--f-mono);white-space:pre-wrap">${esc(a.after)}</pre></div>
    </div>`, `<button class="btn pri" onclick="window.__closeModal()">关闭</button>`);
};

/* Top Review Bar Event Listeners */
document.getElementById('revRole').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  S.role = b.dataset.v;
  document.querySelectorAll('#revRole button').forEach(x => x.classList.toggle('on', x === b));
  if(!isAdmin() && ['users','audit','backups','settings'].includes(S.route)) S.route = 'overview';
  notify(`已切换为「${b.textContent}」视角，无权限菜单与按钮已按规格直接隐藏`);
  render();
});
document.getElementById('revMode').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  S.mode = b.dataset.v; S.setupStep = 1;
  document.querySelectorAll('#revMode button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.getElementById('revPubCase').addEventListener('change', e => {
  S.pubCase = e.target.value; S.pubStepText = ''; S.pubFailedOnce = false;
  S.mode = 'app'; S.route = 'lab-edit'; S.editLabTab = 'publish';
  render();
});

render();
})();
</script>
