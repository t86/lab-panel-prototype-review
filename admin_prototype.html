<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实验室管理后台 (labComputer) · 交互与最终 UI 定稿原型</title>
<style>
:root{
  --bg:#F3F5F8; --card:#FFFFFF; --sunken:#F8FAFC; --header:#0F172A; --sider:#FFFFFF;
  --fg:#1E293B; --fg2:#334155; --muted:#475569; --line:#E2E8F0; --line2:#CBD5E1;
  /* WCAG AA >= 4.5:1 primary & status text tokens (dots keep exact tablet RGB565 hues) */
  --pri:#1D5FD6; --pri-hover:#174EB5; --pri-soft:#EAF2FD;
  --dot-idle:#27AE60; --txt-idle:#166534; --bg-idle:#EAF7EF;
  --dot-busy:#F2994A; --txt-busy:#9A3412; --bg-busy:#FEF5EB;
  --dot-maint:#EB5757; --txt-maint:#B91C1C; --bg-maint:#FDEDED;
  --dot-proc:#2F80ED; --txt-proc:#1E40AF; --bg-proc:#EAF2FD;
  --dot-neutral:#64748B; --txt-neutral:#334155; --bg-neutral:#F1F5F9;
  --f-sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","SF Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--f-sans)}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
a,button.link-btn{color:var(--pri);text-decoration:none;cursor:pointer;background:none;border:none;padding:0;font:inherit}
a:hover,button.link-btn:hover{text-decoration:underline}
button.link-btn.del{color:var(--txt-maint)}

/* Top Review Bar (Wraps cleanly at 1366px without overflow) */
.rev-bar{min-height:38px;height:auto;background:#1E293B;color:#E2E8F0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;padding:6px 16px;font-size:12px;border-bottom:1px solid #334155}
.rev-grp{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.rev-seg{display:inline-flex;background:#0F172A;border:1px solid #475569;border-radius:5px;overflow:hidden}
.rev-seg button{border:none;background:transparent;color:#CBD5E1;padding:3px 9px;font-size:12px;cursor:pointer}
.rev-seg button.on{background:var(--pri);color:#fff;font-weight:600}
.rev-sel{background:#0F172A;color:#F8FAFC;border:1px solid #475569;border-radius:5px;padding:3px 7px;font-size:12px}

/* App Global Frame: Header 56px + Sider 208px + Main */
.app-header{height:56px;background:var(--header);color:#F8FAFC;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 1px 4px rgba(0,0,0,.16)}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:.02em}
.brand-mark{width:28px;height:28px;border-radius:7px;background:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.g-search{position:relative;width:340px}
.g-search input{width:100%;height:34px;border-radius:6px;border:1px solid #475569;background:#1E293B;color:#F8FAFC;padding:0 12px 0 32px;font-size:13px}
.g-search .ico{position:absolute;left:10px;top:8px;color:#94A3B8;font-size:13px;pointer-events:none}
.g-drop{position:absolute;left:0;right:0;top:40px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(15,23,42,.18);z-index:80;max-height:340px;overflow-y:auto}
.g-item{width:100%;text-align:left;background:#fff;border:none;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:13px}
.g-item:hover{background:var(--sunken)}
.g-item:last-child{border-bottom:none}
.hdr-right{display:flex;align-items:center;gap:14px}
.online-pill{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;background:#1E293B;color:#F8FAFC;border:1px solid #475569;cursor:pointer;font-size:12.5px}
.online-pill:hover{border-color:#93C5FD}
.user-chip{display:flex;align-items:center;gap:8px;font-size:13px;color:#E2E8F0}
.role-tag{font-size:11.5px;padding:2px 8px;border-radius:4px;background:#1E3A8A;color:#DBEAFE;border:1px solid #3B82F6}

.app-body{display:flex;min-height:calc(100vh - 96px)}
.app-sider{width:208px;flex:none;background:var(--sider);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav-item{width:100%;height:38px;padding:0 12px;border-radius:7px;border:none;background:transparent;display:flex;align-items:center;justify-content:space-between;color:var(--fg2);cursor:pointer;font-size:13.5px;text-align:left}
.nav-item:hover{background:var(--sunken);color:var(--fg)}
.nav-item.active{background:var(--pri-soft);color:var(--pri);font-weight:600}
.nav-sep{height:1px;background:var(--line);margin:8px 6px}
.nav-badge{font:600 11px/1.4 var(--f-mono);padding:1px 6px;border-radius:999px;background:var(--bg-maint);color:var(--txt-maint)}

.app-main{flex:1;min-width:0;overflow-x:hidden;padding:16px 20px 40px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.page-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.page-hd h1{margin:0;font-size:19px;font-weight:600;display:flex;align-items:center;gap:10px}

/* Common UI Components */
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.card-title{font-size:14.5px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.btn{height:32px;padding:0 13px;border-radius:6px;border:1px solid var(--line2);background:#fff;color:var(--fg);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-hover);color:#fff}
.btn.danger{background:#fff;border-color:#FCA5A5;color:var(--txt-maint)}
.btn.danger:hover{background:#B91C1C;border-color:#B91C1C;color:#fff}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn:disabled{opacity:.48;cursor:not-allowed}

.inp,.sel,textarea.ta{border:1px solid var(--line2);border-radius:6px;padding:5px 10px;font-size:13px;background:#fff}
.inp{height:32px}
.sel{height:32px}
textarea.ta{width:100%;resize:vertical;line-height:1.55}
.inp[readonly],.inp:disabled,textarea.ta[readonly]{background:var(--sunken);color:var(--muted)}

.filter-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.filter-left{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

/* Capsules (Dots match tablet RGB565, text >= 4.5:1 WCAG AA) */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.pill.idle{background:var(--bg-idle);color:var(--txt-idle)}.pill.idle i{background:var(--dot-idle)}
.pill.busy{background:var(--bg-busy);color:var(--txt-busy)}.pill.busy i{background:var(--dot-busy)}
.pill.maint{background:var(--bg-maint);color:var(--txt-maint)}.pill.maint i{background:var(--dot-maint)}
.pill.proc{background:var(--bg-proc);color:var(--txt-proc)}.pill.proc i{background:var(--dot-proc)}
.pill.neutral{background:var(--bg-neutral);color:var(--txt-neutral)}.pill.neutral i{background:var(--dot-neutral)}

/* Responsive Zero-Overflow Tables for 1366x768 */
.tbl-box{border:1px solid var(--line);border-radius:8px;background:#fff;overflow:visible}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.cell-wrap{white-space:normal;overflow:visible}
th{background:var(--sunken);color:var(--muted);font-weight:600;font-size:12px}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFBFD}
.sub-line{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.ops{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.more-wrap{position:relative;display:inline-block}
.more-menu{position:absolute;right:0;top:24px;min-width:118px;background:#fff;border:1px solid var(--line2);border-radius:7px;box-shadow:0 8px 22px rgba(15,23,42,.16);z-index:90;padding:4px}
.more-menu button{width:100%;text-align:left;background:#fff;border:none;border-radius:5px;padding:6px 10px;font-size:12.5px;cursor:pointer;display:block}
.more-menu button:hover{background:var(--sunken)}
.more-menu button.del{color:var(--txt-maint)}
.pager{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--sunken);border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

/* Keyboard-accessible Tabs */
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:9px 4px;cursor:pointer;color:var(--fg2);font-weight:500;position:relative;background:none;border:none}
.tab.active{color:var(--pri);font-weight:600}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--pri)}

/* Forms & Validation */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.f-item{display:flex;flex-direction:column;gap:5px}
.f-item.full{grid-column:1/-1}
.f-lbl{font-size:13px;font-weight:500;color:var(--fg2);display:flex;align-items:center;justify-content:space-between}
.f-req::before{content:"* ";color:var(--txt-maint)}
.f-cnt{font:11.5px var(--f-mono);color:var(--muted);font-weight:400}
.f-glyph{font-size:12px;color:#78350F;background:#FEF3C7;border:1px solid #F59E0B;border-radius:5px;padding:5px 9px}

/* Notifications & Modals */
.toast-stack{position:fixed;right:20px;top:106px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:400px}
.msg{padding:10px 14px;border-radius:8px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(15,23,42,.15);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;font-size:13px}
.msg.ok{border-left:4px solid var(--dot-idle)}
.msg.err{border-left:4px solid var(--dot-maint)}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:150;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:#fff;border-radius:10px;border:1px solid var(--line);box-shadow:0 20px 48px rgba(15,23,42,.26);max-height:90vh;display:flex;flex-direction:column;width:640px;max-width:96vw}
.modal.lg{width:1020px}
.modal-hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600}
.modal-bd{padding:16px 18px;overflow-y:auto;flex:1}
.modal-ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:8px;background:var(--sunken);border-radius:0 0 10px 10px}

/* Transfer & Media Cards */
.transfer{display:grid;grid-template-columns:minmax(0,1fr) 72px minmax(0,1.12fr);gap:12px;align-items:stretch}
.tr-box{border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;height:410px;background:#fff;min-width:0}
.tr-hd{padding:10px 12px;background:var(--sunken);border-bottom:1px solid var(--line);font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tr-list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.tr-row{padding:7px 10px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;background:#fff}
.tr-row:hover{border-color:var(--pri)}
.media-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px}
.thumb-card{width:112px;height:78px;border-radius:6px;border:1px solid var(--line);overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:11.5px;text-align:center;padding:6px}
.layout-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.l-card{border:2px solid var(--line);border-radius:8px;padding:11px;cursor:pointer;background:#fff;text-align:left;width:100%}
.l-card.sel{border-color:var(--pri);background:#F8FBFF}
.prog-track{height:8px;border-radius:999px;background:#E2E8F0;overflow:hidden}
.prog-bar{height:100%;background:var(--pri);transition:width .25s}
</style>
</head>

</div>

function findMissingGlyphs(text){
  if(!text) return [];
  const rare = [];
  for(const ch of text){
    const cp = ch.codePointAt(0);
    if((cp >= 0x3400 && cp <= 0x4DBF) || cp >= 0x20000 || '龘㵘𠀀喆镕'.includes(ch)){
      if(!rare.includes(ch)) rare.push(ch);
    }
  }
  return rare;
}

/* P1-1 Fix: identify sync status by (committedLabId, committedVer, committedSha), NOT mere numeric > */
function labPubState(lab){
  const p = panelOfLab(lab.id);
  if(!p) return {k:'neutral', t:'未绑平板', isPending:false};
  const ps = S.pubStateByLab[lab.id];
  if(ps && ps.status === 'unverified') return {k:'proc', t:'待核验 (commit 回包超时)', isPending:true};
  if(DB.publishJobs.find(j => j.labId === lab.id && j.status === '失败' && p.committedVer < lab.manifest_version)) return {k:'maint', t:'发布失败', isPending:true};
  const curSha = computeSha(lab);
  if(p.committedLabId && p.committedLabId !== lab.id){
    const oldLab = DB.labs.find(x => x.id === p.committedLabId);
    return {k:'busy', t:`待换绑替换 (${oldLab?oldLab.code:p.committedLabId} v${p.committedVer}→v${lab.manifest_version})`, isPending:true, isRebind:true};
  }
  if(!p.committedLabId || p.committedVer !== lab.manifest_version || p.committedSha !== curSha){
    return {k:'busy', t:`待发布 (v${p.committedVer||0}→v${lab.manifest_version})`, isPending:true};
  }
  return {k:'idle', t:`已同步 v${lab.manifest_version}`, isPending:false};
}

function ensurePublishSnapshot(lab, forceRefresh=false){
  const p = panelOfLab(lab.id);
  const existing = S.pubSnapshots[lab.id];
  if(!forceRefresh && existing) return existing;
  const sha = computeSha(lab);
  const snap = {
    snapId: `SNAP-${lab.id}-v${lab.manifest_version}-${sha.slice(0,6)}`,
    labId: lab.id,
    version: lab.manifest_version,
    sha,
    panelId: p ? p.id : '',
    bindingRev: p ? p.bindingRev : 0,
    rebindFromLabId: (p && p.committedLabId && p.committedLabId !== lab.id) ? p.committedLabId : '',
    labCopy: JSON.parse(JSON.stringify(lab))
  };
  S.pubSnapshots[lab.id] = snap;
  return snap;
}

function isSnapshotStale(lab, snap){
  const p = panelOfLab(lab.id);
  if(!snap) return {stale:true, reason:'尚未生成快照'};
  const curSha = computeSha(lab);
  if(lab.manifest_version !== snap.version || curSha !== snap.sha){
    return {stale:true, reason:`后台内容已并发更新至 v${lab.manifest_version}（当前预览快照为 v${snap.version}）`};
  }
  if((p ? p.id : '') !== snap.panelId || (p ? p.bindingRev : 0) !== snap.bindingRev){
    return {stale:true, reason:'目标平板绑定关系已发生变化（binding_rev 不一致）'};
  }
  return {stale:false, reason:''};
}

function syncHash(){
  const q = new URLSearchParams();
  if(S.route === 'labs'){
    if(S.labFilter.status) q.set('status', S.labFilter.status);
    if(S.labFilter.pub) q.set('pub', S.labFilter.pub);
  } else if(S.route === 'panels' && S.panelFilter.online !== ''){
    q.set('online', S.panelFilter.online);
  }
  const qs = q.toString();
  history.replaceState(null, '', `#/${S.route}${qs ? '?' + qs : ''}`);
}

/* ==================== 2. Proportional Layout Region Schematic SVG ==================== */
function renderLayoutSchematicSVG(lay, w=156, h=104){
  const pad = 6;
  const sc = Math.min((w - pad*2) / lay.w, (h - pad*2) / lay.h);
  const rw = lay.w * sc, rh = lay.h * sc;
  const ox = (w - rw) / 2, oy = (h - rh) / 2;
  const palette = {
    video:  ['#DBEAFE','#1D4ED8','视频'],
    title:  ['#FEF3C7','#92400E','标题'],
    cards:  ['#DCFCE7','#166534','卡片'],
    gallery:['#FCE7F3','#9D174D','画廊'],
    notice: ['#F1F5F9','#334155','须知']
  };
  const rects = lay.regions.map(r => {
    const [fill, stroke, cn] = palette[r.id] || ['#E2E8F0','#475569',r.id];
    const x = ox + r.x*sc, y = oy + r.y*sc, bw = r.w*sc, bh = r.h*sc;
    return `<g>
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/>
      ${bh >= 13 ? `<text x="${(x+bw/2).toFixed(1)}" y="${(y+bh/2+3.5).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="${stroke}" font-weight="600">${cn}</text>` : ''}
    </g>`;
  }).join('');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="background:#F8FAFC;border-radius:6px;border:1px solid var(--line);display:block">
    <rect x="${ox.toFixed(1)}" y="${oy.toFixed(1)}" width="${rw.toFixed(1)}" height="${rh.toFixed(1)}" fill="#0F172A" rx="2"/>
    ${rects}
  </svg>`;
}

function renderEmbeddedPanelPreview(labSnapshot, layoutId, sourceTag, interactive=true){
  const lay = LAYOUT_DEFS.find(x => x.id === layoutId) || LAYOUT_DEFS[0];
  /* Fallback when firmware supports a new layout not yet compiled into previewer */
  if(!lay.previewSupported){
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px;border:1px dashed var(--line2);border-radius:8px;background:#fff">
      <div class="f-glyph" style="width:100%">⚠️ 固件支持布局「${esc(lay.name)} (<code>${lay.id}</code>)」，但当前预览器版本尚未收录该布局，已自动降级显示区块示意图（不影响正常下发 <code>set_layout</code>）。</div>
      ${renderLayoutSchematicSVG(lay, 260, 220)}
      <span style="font-size:12px;color:var(--muted)">数据来源：${esc(sourceTag)} · 逻辑尺寸 ${lay.w}×${lay.h}</span>
    </div>`;
  }

  const isP = lay.orientation === 'portrait';
  const scale = isP ? 0.34 : 0.49;
  const sw = Math.round(lay.w * scale), sh = Math.round(lay.h * scale);

  if(!labSnapshot){
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div style="padding:8px;border-radius:10px;background:#05080D;border:1px solid #334155">
        <div style="position:relative;width:${sw}px;height:${sh}px;overflow:hidden">
          <div style="position:absolute;left:0;top:0;width:${lay.w}px;height:${lay.h}px;transform:scale(${scale});transform-origin:0 0;background:#0B0F14;display:flex;align-items:center;justify-content:center;color:#F2F5F8">
            <div style="width:620px;padding:42px;border-radius:12px;background:#151B23;border:1px solid #2A3441;text-align:center">
              <div style="font-size:40px">本平板尚未绑定实验室</div>
              <div style="font-size:26px;color:#A7B1BD;margin-top:16px">未绑定状态 (Unbound) · 当前无生效清单</div>
            </div>
          </div>
        </div>
      </div>
      <span style="font-size:12px;color:var(--muted)">原型 HTML 模拟预览（生产环境替换为真实 lab_preview.wasm）· 来源：${esc(sourceTag)}</span>
    </div>`;
  }

  const eqs = (labSnapshot.equipIds || []).map(id => DB.equipment.find(e => e.id === id)).filter(Boolean);
  const g = s => esc(String(s||'').replace(/[㵘𠀀龘]/g, '□'));

  let screenInner = '';
  if(interactive && S.previewEquipDetailId){
    const eq = eqs.find(e => e.id === S.previewEquipDetailId) || eqs[0];
    screenInner = `<div style="position:absolute;inset:0;background:#0B0F14;color:#F2F5F8;padding:24px;display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;align-items:center;gap:20px;border-bottom:1px solid #2A3441;padding-bottom:14px">
        <div onclick="window.__previewBack()" style="margin-left:96px;padding:12px 26px;border-radius:12px;background:#151B23;border:1px solid #2A3441;font-size:28px;cursor:pointer">‹ 返回待机</div>
        <span style="font-size:38px">${g(eq.name)}</span>
      </div>
      <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:24px;flex:1">
        <div style="background:#13283F;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#93C5FD">▶ 3D 演示视口 (${esc(eq.model)})</div>
        <div style="background:#151B23;border-radius:12px;padding:20px;font-size:26px;color:#A7B1BD">
          <div style="color:#F2F5F8;margin-bottom:10px">资产编号：${g(eq.asset_no)} · 状态：${g(eq.status)}</div>
          ${(eq.specs||[]).map(([k,v])=>`<div style="padding:8px 0;border-bottom:1px solid #2A3441;display:flex;justify-content:space-between"><span>${g(k)}</span><span style="color:#F2F5F8">${g(v)}</span></div>`).join('')}
        </div>
      </div>
    </div>`;
  } else {
    lay.regions.forEach(r => {
      if(r.id === 'video'){
        screenInner += `<div style="position:absolute;left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:#10253B;display:flex;flex-direction:column;justify-content:space-between;padding:18px">
          <span style="font-size:22px;color:#93C5FD">● 模拟视口 · 16:9 静音 (${r.w}×${r.h})</span>
          ${eqs[0] ? `<div ${interactive?`onclick="window.__previewOpenEq('${eqs[0].id}')" style="cursor:pointer;`:'style="'}background:rgba(11,15,20,.82);height:64px;padding:0 20px;font-size:22px;color:#F2F5F8;display:flex;align-items:center;justify-content:space-between"><span>▶ ${g(eqs[0].name)} · 3D 演示</span><span style="color:#60A5FA">查看详情 ›</span></div>` : ''}
        </div>`;
      } else if(r.id === 'title'){
        screenInner += `<div style="position:absolute;left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:#151B23;border:1px solid #2A3441;padding:${r.h<=80?'0 24px':'22px'};display:flex;flex-direction:${r.h<=80?'row':'column'};align-items:${r.h<=80?'center':'flex-start'};justify-content:space-between;color:#F2F5F8">
          <div>
            <div style="font-size:${r.h<=80?'30px':'52px'};line-height:1.2">${g(labSnapshot.name)}</div>
            ${r.h > 80 ? `<div style="font-size:28px;color:#A7B1BD;margin-top:8px">${g(labSnapshot.code)} · ${g([labSnapshot.bld,labSnapshot.flr,labSnapshot.rm].filter(Boolean).join(' '))}</div>` : ''}
          </div>
          <span style="padding:6px 18px;border-radius:999px;background:rgba(242,153,74,.2);color:#F2994A;font-size:22px">● ${g(labSnapshot.status)}</span>
        </div>`;
      } else if(r.id === 'cards'){
        screenInner += `<div style="position:absolute;left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:#0B0F14;border-top:1px solid #2A3441;padding:18px 24px;display:flex;gap:16px;overflow:hidden;flex-wrap:${isP?'wrap':'nowrap'}">
          ${eqs.length ? eqs.slice(0, isP?6:4).map(e => `<div ${interactive?`onclick="window.__previewOpenEq('${e.id}')" style="cursor:pointer;`:'style="'}width:${isP?232:272}px;height:242px;border-radius:12px;background:#151B23;border:1px solid #2A3441;overflow:hidden;flex:none">
            <div style="height:146px;background:${e.hue||'#1E3A5F'};display:flex;align-items:center;justify-content:center;color:#CBD5E1;font-size:22px">${g(e.model)}</div>
            <div style="padding:12px;color:#F2F5F8;font-size:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${g(e.name)}</div>
          </div>`).join('') : `<div style="margin:auto;color:#A7B1BD;font-size:26px">暂无试验设备</div>`}
        </div>`;
      } else if(r.id === 'notice'){
        screenInner += `<div style="position:absolute;left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:#151B23;border-top:1px solid #2A3441;padding:0 24px;display:flex;align-items:center;gap:16px;color:#A7B1BD;font-size:22px;white-space:nowrap;overflow:hidden">
          <span style="color:#F2994A">[安全须知]</span><span>${g((labSnapshot.safety||[]).join(' · '))}</span>
        </div>`;
      }
    });
  }

  return `<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <div style="padding:8px;border-radius:10px;background:#05080D;border:1px solid #334155">
      <div style="position:relative;width:${sw}px;height:${sh}px;overflow:hidden">
        <div style="position:absolute;left:0;top:0;width:${lay.w}px;height:${lay.h}px;transform:scale(${scale});transform-origin:0 0;user-select:none">${screenInner}</div>
      </div>
    </div>
    <span style="font-size:12px;color:var(--muted)">原型 HTML 模拟预览（生产环境替换为真实 <code>lab_preview.wasm</code>）· 数据来源：<strong>${esc(sourceTag)}</strong></span>
  </div>`;
}
window.__previewOpenEq = id => { S.previewEquipDetailId = id; render(); };
window.__previewBack = () => { S.previewEquipDetailId = null; render(); };

function renderOverview(){
  const onlineCnt = DB.panels.filter(p => p.online).length;
  const offlinePanels = DB.panels.filter(p => !p.online);
  const pendingLabs = DB.labs.filter(l => labPubState(l).isPending);
  const failedJobs = DB.publishJobs.filter(j => j.status === '失败' || j.status === '待核验');
  const badMedia = DB.mediaLib.filter(m => m.status === 'rejected');

  return `
    <div class="page-hd"><h1>系统概览</h1><span style="font-size:12.5px;color:var(--muted)">每 30 秒轮询平板 info 核对 (lab_id, version, sha256)</span></div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px">
      <div class="card"><div style="color:var(--muted);font-size:12.5px">实验室总数</div><div style="font-size:28px;font-weight:700;margin-top:4px">${DB.labs.length}</div><div style="font-size:12px;color:var(--muted);margin-top:4px">已绑定平板 ${DB.panels.filter(p=>p.labId).length} 间 · 未绑定 ${DB.labs.filter(l=>!panelOfLab(l.id)).length} 间</div></div>
      <div class="card"><div style="color:var(--muted);font-size:12.5px">试验设备总数</div><div style="font-size:28px;font-weight:700;margin-top:4px">${DB.equipment.length}</div><div style="font-size:12px;color:var(--muted);margin-top:4px">未分配 ${DB.equipment.filter(e=>!labOfEquip(e.id)).length} 台</div></div>
      <button type="button" class="card" style="text-align:left;cursor:pointer" onclick="window.__nav('panels',{panelFilter:{online:'0'}})">

        <div style="font-size:28px;font-weight:700;margin-top:4px;color:${offlinePanels.length?'var(--txt-busy)':'var(--txt-idle)'}">${onlineCnt} / ${DB.panels.length}</div>
        <div style="font-size:12px;color:var(--pri);margin-top:4px">点击筛选 ${offlinePanels.length} 台离线平板 →</div>
      </button>
      <button type="button" class="card" style="text-align:left;cursor:pointer" onclick="window.__nav('labs',{labFilter:{status:'',pub:'pending',kw:''}})">
        <div style="color:var(--muted);font-size:12.5px">待发布实验室</div>
        <div style="font-size:28px;font-weight:700;margin-top:4px;color:var(--txt-busy)">${pendingLabs.length}</div>

      </button>
    </div>

    <div class="card">
      <div class="card-title"><span>需要处理的事项（点击直接跳转对应页面）</span></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${offlinePanels.map(p => `<div class="tr-row">
          <div><span class="pill maint"><i></i>平板离线</span> <strong style="margin-left:8px">${esc(p.name)} (${p.ip})</strong> <span style="color:var(--muted);margin-left:8px">${esc(p.lastErr)}</span></div>
          <button type="button" class="link-btn" onclick="window.__nav('panels',{panelFilter:{online:'0'}})">去处理 →</button>
        </div>`).join('')}
        ${pendingLabs.map(l => {
          const ps = labPubState(l);

        ${failedJobs.map(j => `<div class="tr-row">
          <div><span class="pill ${j.status==='待核验'?'proc':'maint'}"><i></i>${j.status}</span> <strong style="margin-left:8px">${esc(j.lab)} → ${esc(j.panel)}</strong> <span style="color:var(--muted);margin-left:8px">${esc(j.err||'需回读确认')}</span></div>

/* 4.2 Labs List (100% fits 1366x768 with zero clipping) */
function renderLabs(){
  const list = DB.labs.filter(l => {
    if(S.labFilter.status && l.status !== S.labFilter.status) return false;
    const ps = labPubState(l);
    if(S.labFilter.pub === 'pending' && !ps.isPending) return false;
    if(S.labFilter.pub === 'synced' && ps.k !== 'idle') return false;
    if(S.labFilter.pub === 'failed' && ps.k !== 'maint') return false;
    if(S.labFilter.kw && !(l.name+l.code+l.owner).includes(S.labFilter.kw)) return false;
    return true;
  });

  return `
    <div class="page-hd">
      <h1>实验室管理</h1>
      <div style="display:flex;gap:8px">
        ${canEdit() ? `<button type="button" class="btn" onclick="window.__batchPublish()">批量发布已选 (${S.selectedLabIds.length})</button>
        <button type="button" class="btn pri" onclick="window.__createLab()">+ 新建实验室</button>` : ''}
      </div>
    </div>
    <div class="filter-bar">
      <div class="filter-left">
        <select class="sel" aria-label="状态筛选" onchange="window.__setLabFilter('status',this.value)">
          <option value="">全部运行状态</option>
          ${['空闲','使用中','维护'].map(s=>`<option value="${s}" ${S.labFilter.status===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <select class="sel" aria-label="发布状态筛选" onchange="window.__setLabFilter('pub',this.value)">
          <option value="">全部发布状态</option>
          <option value="pending" ${S.labFilter.pub==='pending'?'selected':''}>待发布 / 待换绑替换</option>
          <option value="synced" ${S.labFilter.pub==='synced'?'selected':''}>已同步</option>
          <option value="failed" ${S.labFilter.pub==='failed'?'selected':''}>发布失败</option>
        </select>
        <input class="inp" placeholder="搜索编号 / 实验室名称 / 负责人" value="${esc(S.labFilter.kw)}" oninput="window.__setLabFilter('kw',this.value)" style="width:230px">
      </div>
      <span style="font-size:12px;color:var(--muted)">1366×768 零横向裁切 · 筛选已同步 URL</span>
    </div>
    <div class="tbl-box">
      <table>
        <thead><tr>
          <th style="width:3.5%"><input type="checkbox" aria-label="全选" onchange="window.__toggleAllLabs(this.checked)"></th>
          <th style="width:22%">实验室名称 / 编号</th>
          <th style="width:12%">位置</th>
          <th style="width:8.5%">状态</th>
          <th style="width:6.5%">设备</th>
          <th style="width:14%">绑定平板</th>
          <th style="width:20%">发布状态</th>
          <th style="width:13.5%">操作</th>
        </tr></thead>
        <tbody>
          ${list.map(l => {
            const p = panelOfLab(l.id);
            const ps = labPubState(l);
            return `<tr>
              <td><input type="checkbox" aria-label="选择${esc(l.name)}" ${S.selectedLabIds.includes(l.id)?'checked':''} onchange="window.__toggleLabSel('${l.id}',this.checked)"></td>
              <td>
                <button type="button" class="link-btn" onclick="window.__nav('lab-edit',{editLabId:'${l.id}',editLabTab:'basic'})"><strong>${esc(l.name)}</strong></button>
                <div class="sub-line mono">${esc(l.code)} · ${l.updated.slice(5)}</div>
              </td>
              <td>${esc(l.bld+' '+l.flr+' '+l.rm)}</td>
              <td>${statusPill(l.status)}</td>
              <td class="mono">${l.equipIds.length} 台</td>
              <td>${p ? `<span style="color:${p.online?'var(--dot-idle)':'var(--dot-maint)'}">●</span> ${esc(p.name)}` : '<span style="color:var(--muted)">未绑定</span>'}</td>
              <td><span class="pill ${ps.k}" title="${esc(ps.t)}"><i></i>${esc(ps.t)}</span></td>
              <td><div class="ops">
                <button type="button" class="link-btn" onclick="window.__nav('lab-edit',{editLabId:'${l.id}',editLabTab:'basic'})">${canEdit()?'编辑':'查看'}</button>
                ${canEdit() ? `<button type="button" class="link-btn" onclick="window.__nav('lab-edit',{editLabId:'${l.id}',editLabTab:'publish'})">发布</button>
                <button type="button" class="link-btn del" onclick="window.__deleteLab('${l.id}')">删除</button>` : ''}
              </div></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      <div class="pager"><span>共 ${list.length} 条记录 · 每页 20 条（服务端排序）</span><span>第 1 / 1 页</span></div>
    </div>`;
}

function glyphHintInner(val){
  const miss = findMissingGlyphs(val);
  if(!miss.length) return '';
  return `<div class="f-glyph">⚠️ 以下字在平板字库 (wqyMicroHei) 中缺失，在平板上会显示为方框：<strong>${miss.join('、')}</strong>（仅提示，不阻止保存）</div>`;
}

function renderLabEdit(){
  const committedLab = DB.labs.find(x => x.id === S.editLabId) || DB.labs[0];
  if(!S.labDraft || S.labDraft.id !== committedLab.id) S.labDraft = JSON.parse(JSON.stringify(committedLab));
  const lab = S.labDraft;
  const ro = !canEdit();
  const locLen = [lab.bld, lab.flr, lab.rm].filter(Boolean).join(' ').length;

  let tabBody = '';
  if(S.editLabTab === 'basic'){
    tabBody = `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap">
        <span style="font-size:12.5px;color:var(--muted)">编辑独立草稿副本（连续中文输入绝不失焦；离开不保存自动丢弃草稿）；失焦检查平板字库缺字。</span>
        ${!ro ? `<button type="button" class="btn sm" onclick="window.__injectRareChar()">填入生僻字“㵘”验证缺字提示</button>` : ''}
      </div>
      <div class="form-grid">
        <div class="f-item">
          <label class="f-lbl"><span class="f-req">实验室编号（唯一，[A-Za-z0-9-]）</span><span class="f-cnt" id="cnt-lab-code">${lab.code.length}/16</span></label>
          <input class="inp mono" maxlength="16" value="${esc(lab.code)}" ${ro?'readonly':''} oninput="window.__updLabField('code',this.value,16)">
        </div>
        <div class="f-item">
          <label class="f-lbl"><span class="f-req">实验室名称</span><span class="f-cnt" id="cnt-lab-name">${lab.name.length}/30</span></label>
          <input class="inp" maxlength="30" value="${esc(lab.name)}" ${ro?'readonly':''} oninput="window.__updLabField('name',this.value,30,true)">
          <div id="glyph-lab-name">${glyphHintInner(lab.name)}</div>
        </div>
        <div class="f-item">
          <label class="f-lbl"><span>楼栋 / 楼层 / 房间号（拼接后 ≤ 30 字）</span><span class="f-cnt" id="cnt-lab-loc">${locLen}/30</span></label>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
            <input class="inp" placeholder="楼栋" value="${esc(lab.bld)}" ${ro?'readonly':''} oninput="window.__updLabLoc('bld',this.value)">
            <input class="inp" placeholder="楼层" value="${esc(lab.flr)}" ${ro?'readonly':''} oninput="window.__updLabLoc('flr',this.value)">
            <input class="inp" placeholder="房间号" value="${esc(lab.rm)}" ${ro?'readonly':''} oninput="window.__updLabLoc('rm',this.value)">
          </div>
        </div>
        <div class="f-item">
          <label class="f-lbl"><span>当前状态（可选或手输 ≤ 6 字）</span><span class="f-cnt" id="cnt-lab-status">${lab.status.length}/6</span></label>
          <div style="display:flex;gap:8px">
            <select class="sel" ${ro?'disabled':''} onchange="window.__updLabStatusSelect(this.value)" style="width:130px">
              ${['空闲','使用中','维护'].map(s=>`<option value="${s}" ${lab.status===s?'selected':''}>${s}</option>`).join('')}
            </select>
            <input id="inp-lab-status" class="inp" maxlength="6" placeholder="或手动输入自定义状态" value="${esc(lab.status)}" ${ro?'readonly':''} oninput="window.__updLabField('status',this.value,6)" style="flex:1">
          </div>
        </div>
        <div class="f-item">
          <label class="f-lbl"><span>负责人</span><span class="f-cnt" id="cnt-lab-owner">${lab.owner.length}/20</span></label>
          <input class="inp" maxlength="20" value="${esc(lab.owner)}" ${ro?'readonly':''} oninput="window.__updLabField('owner',this.value,20,true)">
          <div id="glyph-lab-owner">${glyphHintInner(lab.owner)}</div>
        </div>
        <div class="f-item">
          <label class="f-lbl"><span>联系电话</span><span class="f-cnt" id="cnt-lab-phone">${lab.phone.length}/20</span></label>
          <input class="inp mono" maxlength="20" value="${esc(lab.phone)}" ${ro?'readonly':''} oninput="window.__updLabField('phone',this.value,20)">
        </div>
        <div class="f-item full">
          <label class="f-lbl"><span>开放时间</span><span class="f-cnt" id="cnt-lab-open_hours">${lab.open_hours.length}/40</span></label>
          <input class="inp" maxlength="40" value="${esc(lab.open_hours)}" ${ro?'readonly':''} oninput="window.__updLabField('open_hours',this.value,40)">
        </div>
        <div class="f-item full">
          <label class="f-lbl"><span>实验室简介</span><span class="f-cnt" id="cnt-lab-intro">${lab.intro.length}/2000</span></label>
          <textarea class="ta" rows="3" maxlength="2000" ${ro?'readonly':''} oninput="window.__updLabField('intro',this.value,2000,true)">${esc(lab.intro)}</textarea>
          <div id="glyph-lab-intro">${glyphHintInner(lab.intro)}</div>
        </div>
        <div class="f-item full">
          <label class="f-lbl"><span>安全须知（可调整顺序 · 最多 10 条，每条 ≤ 40 字）</span><span class="f-cnt">${lab.safety.length}/10 条</span></label>
          <div style="display:flex;flex-direction:column;gap:6px">
            ${lab.safety.map((s, idx) => `<div style="display:flex;align-items:center;gap:8px">
              <span class="mono" style="color:var(--muted);width:22px">${idx+1}.</span>
              <input class="inp" maxlength="40" value="${esc(s)}" ${ro?'readonly':''} oninput="window.__updSafety(${idx},this.value)" style="flex:1">
              ${!ro ? `<button type="button" class="btn sm" onclick="window.__moveSafety(${idx},-1)">↑</button>
              <button type="button" class="btn sm" onclick="window.__moveSafety(${idx},1)">↓</button>
              <button type="button" class="btn sm danger" onclick="window.__delSafety(${idx})">删除</button>` : ''}
            </div>`).join('')}
            ${(!ro && lab.safety.length < 10) ? `<div><button type="button" class="btn sm" onclick="window.__addSafety()">+ 添加一条安全须知</button></div>` : ''}
          </div>
        </div>
      </div>
      ${!ro ? `<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px">
        <button type="button" class="btn" onclick="window.__nav('labs')">取消并返回</button>
        <button type="button" class="btn pri" onclick="window.__saveLab()">保存基本信息（清单版本 +1）</button>
      </div>` : ''}
    </div>`;
  }

  else if(S.editLabTab === 'equip'){
    const curEqs = committedLab.equipIds.map(id => DB.equipment.find(e => e.id === id)).filter(Boolean);
    const leftPool = DB.equipment.filter(e => {
      if(committedLab.equipIds.includes(e.id)) return false;
      const ownerLab = labOfEquip(e.id);
      return S.showOtherLabEq ? true : !ownerLab;
    });

    tabBody = `<div class="card">
      <div class="transfer">
        <div class="tr-box">
          <div class="tr-hd"><span>可添加的试验设备 (${leftPool.length})</span>
            <label style="font-weight:400;font-size:12px;cursor:pointer"><input type="checkbox" ${S.showOtherLabEq?'checked':''} onchange="window.__toggleOtherEq(this.checked)"> 显示已属于其他实验室的设备</label>
          </div>
          <div class="tr-list">
            ${leftPool.map(e => {
              const ol = labOfEquip(e.id);
              return `<div class="tr-row">
                <div style="min-width:0">
                  <div><strong>${esc(e.name)}</strong> <span class="mono" style="color:var(--muted)">${esc(e.model)}</span></div>
                  <div style="font-size:11.5px;color:var(--muted)">${esc(e.asset_no)} · ${ol ? `<span style="color:var(--txt-busy);font-weight:600">属于 ${esc(ol.name)} (v${ol.manifest_version})</span>` : '<span style="color:var(--txt-idle)">未分配</span>'}</div>
                </div>
                ${!ro ? `<button type="button" class="btn sm pri" onclick="window.__addEqToLab('${e.id}')">添加 ▶</button>` : ''}
              </div>`;
            }).join('') || `<div style="margin:auto;color:var(--muted);font-size:12.5px">暂无可添加的未分配设备（可勾选上方复选框跨室调拨）</div>`}
          </div>
        </div>

        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12px;text-align:center">
          <span>单设备<br>唯一归属</span><span>⇄</span>
        </div>

        <div class="tr-box">
          <div class="tr-hd"><span>本实验室设备（平板卡片按此顺序排列）</span><span class="mono">${curEqs.length} / 60</span></div>
          <div class="tr-list">
            ${curEqs.map((e, idx) => `<div class="tr-row">
              <div style="display:flex;align-items:center;gap:8px;min-width:0">
                <span class="mono" style="color:var(--muted)">≡ ${String(idx+1).padStart(2,'0')}</span>
                <div style="min-width:0">
                  <div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><strong>${esc(e.name)}</strong></div>
                  <div class="mono" style="font-size:11.5px;color:var(--muted)">${esc(e.asset_no)} · ${esc(e.model)}</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:5px;flex:none">
                ${statusPill(e.status)}
                ${!ro ? `<button type="button" class="btn sm" onclick="window.__reorderLabEq(${idx},-1)">↑</button>
                <button type="button" class="btn sm" onclick="window.__reorderLabEq(${idx},1)">↓</button>
                <button type="button" class="btn sm danger" onclick="window.__removeEqFromLab('${e.id}')">移除</button>` : ''}
              </div>
            </div>`).join('') || `<div style="margin:auto;color:var(--muted)">当前实验室尚未配置设备</div>`}
          </div>
        </div>
      </div>
    </div>`;
  }

  else if(S.editLabTab === 'media'){
    tabBody = renderMediaManagerWidget();
  }

  else if(S.editLabTab === 'publish'){
    const p = panelOfLab(committedLab.id);
    const snap = ensurePublishSnapshot(committedLab, false);
    const staleInfo = isSnapshotStale(committedLab, snap);
    const pubSt = S.pubStateByLab[committedLab.id] || {status:'idle', running:false, text:'', progress:0, jobId:''};
    const missGlyphs = findMissingGlyphs(snap.labCopy.name + snap.labCopy.owner + snap.labCopy.intro);
    const c = S.pubCase;
    const isBlocked = !p || staleInfo.stale || c === 'offline' || c === 'nospace' || c === 'rejected' || (!p.online && c === 'ready');
    const blockReason = !p ? '当前实验室尚未绑定门口平板'
      : staleInfo.stale ? `发布快照已失效：${staleInfo.reason}`
      : (c === 'offline' || !p.online) ? `目标平板「${p.name} (${p.ip})」当前离线`
      : c === 'nospace' ? '平板 NAND 剩余空间不足（需 41.2 MB，仅剩 18.0 MB，HTTP 507）'
      : c === 'rejected' ? '存在 1 个状态为「拒绝」的视频素材，请先在媒体页移除' : '';

    tabBody = `<div style="display:grid;grid-template-columns:366px minmax(0,1fr);gap:16px;align-items:start">
      <div class="card">
        <div class="card-title">
          <span>发布前检查（不可变快照）</span>
          <button type="button" class="btn sm" onclick="window.__refreshSnapshot('${committedLab.id}')">↻ 刷新快照</button>
        </div>
        <div style="padding:7px 10px;border-radius:6px;background:var(--sunken);border:1px solid var(--line);font-size:12px;margin-bottom:10px">
          <div>快照 ID：<code class="mono">${esc(snap.snapId)}</code></div>
          <div style="color:var(--muted);margin-top:2px">SHA-256: <code class="mono">${snap.sha}</code> · binding_rev: <code class="mono">${snap.bindingRev}</code></div>
        </div>

        <div style="display:flex;flex-direction:column;gap:9px;font-size:13px">
          <div style="display:flex;justify-content:space-between"><span>目标平板</span><strong>${p ? `${esc(p.name)} <span style="color:${(p.online && c!=='offline')?'var(--txt-idle)':'var(--txt-maint)'}">● ${(p.online && c!=='offline')?'在线':'离线'}</span>` : '未绑定 ❌'}</strong></div>
          <div style="display:flex;justify-content:space-between"><span>清单对比</span><span class="mono">${p ? `${p.committedLabId||'无'} v${p.committedVer||0} → ${committedLab.id} v${snap.version}` : '—'}</span></div>
          ${snap.rebindFromLabId ? `<div class="f-glyph">🔁 检测到平板原绑定实验室 <code>${snap.rebindFromLabId}</code>（v${p?p.committedVer:0}），本次首次发布将自动携带 <code>force=1&expected_lab_id=${snap.rebindFromLabId}</code> 执行显式替换。</div>` : ''}
          <div style="display:flex;justify-content:space-between"><span>平板空间</span><span>${c==='nospace' ? '<strong style="color:var(--txt-maint)">剩余 18 MB ❌ 不足</strong>' : '剩余 812 MB ✅'}</span></div>
          <div style="display:flex;justify-content:space-between"><span>媒体流水线</span><span>${c==='transcoding' ? '<strong style="color:var(--txt-proc)">1 个视频转码中 (64%) ⏳</strong>' : c==='rejected' ? '<strong style="color:var(--txt-maint)">1 个视频被拒绝 ❌</strong>' : '全部就绪 (MP4 H.264) ✅'}</span></div>
          <div style="display:flex;justify-content:space-between"><span>字库检查</span><span>${missGlyphs.length ? `<strong style="color:var(--txt-busy)">${missGlyphs.length} 个缺字显示方框 ⚠️</strong>` : '全部在字库内 ✅'}</span></div>
        </div>

        ${isBlocked ? `<div style="margin-top:12px;padding:9px 11px;border-radius:6px;background:var(--bg-maint);color:var(--txt-maint);font-size:12.5px">⛔ 无法发布：${esc(blockReason)}</div>` : ''}

        ${canEdit() ? `<div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">
          <button type="button" class="btn pri" style="width:100%;height:38px" ${isBlocked||pubSt.running?'disabled':''} onclick="window.__runPublish('${committedLab.id}')">
            ${c === 'transcoding' ? '⏳ 锁定当前快照等待转码完成后发布' : snap.rebindFromLabId ? '显式替换并发布到平板 (force=1)' : '发布当前快照到门口平板'}
          </button>
          <div style="display:flex;gap:6px">
            <button type="button" class="btn sm" style="flex:1" onclick="window.__simConcurrentSave('${committedLab.id}')">演练：他人并发保存 v+1</button>
            <button type="button" class="btn sm" style="flex:1" onclick="window.__simConcurrentRebind('${committedLab.id}')">演练：并发换绑</button>
          </div>
        </div>` : ''}

        ${pubSt.text ? `<div style="margin-top:14px;padding:12px;border-radius:8px;background:var(--sunken);border:1px solid var(--line)">
          <div style="font-size:12px;color:var(--muted);margin-bottom:4px" class="mono">任务 ${esc(pubSt.jobId)} · 目标快照 ${esc(pubSt.snapId)}</div>
          <div style="font-size:12.5px;font-weight:600;margin-bottom:6px;color:${pubSt.status==='failed'?'var(--txt-maint)':pubSt.status==='unverified'?'var(--txt-proc)':'var(--fg)'}">${esc(pubSt.text)}</div>
          <div class="prog-track"><div class="prog-bar" style="width:${pubSt.progress}%;background:${pubSt.status==='failed'?'var(--dot-maint)':'var(--pri)'}"></div></div>
          ${(canEdit() && pubSt.status === 'failed') ? `<div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:12px;color:var(--muted)">已传完 2/3 个文件</span>
            <button type="button" class="btn sm pri" onclick="window.__retryPublish('${committedLab.id}','${pubSt.jobId}')">按任务重试（跳过已传）</button>
          </div>` : ''}
          ${(canEdit() && pubSt.status === 'unverified') ? `<div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:12px;color:var(--muted)">平板可能已落盘，不武断判旧版</span>
            <button type="button" class="btn sm pri" onclick="window.__verifyUnverifiedPublish('${committedLab.id}','${pubSt.jobId}')">回读 info 核验</button>
          </div>` : ''}
        </div>` : ''}
      </div>

      <div class="card">
        <div class="card-title">
          <span>待发布快照预览（与左侧共用 <code>${esc(snap.snapId)}</code>）</span>
          <div style="display:flex;align-items:center;gap:8px;font-weight:400;font-size:12.5px">
            <label style="cursor:pointer"><input type="checkbox" ${S.previewFwDiff?'checked':''} onchange="window.__toggleFwDiff(this.checked)"> 模拟固件版本差异</label>
            <select class="sel" aria-label="预览布局" onchange="window.__setPreviewLayout(this.value)">
              ${LAYOUT_DEFS.map(d => `<option value="${d.id}" ${S.previewLayout===d.id?'selected':''}>${d.name}</option>`).join('')}
            </select>
          </div>
        </div>
        ${(S.previewFwDiff || (p && !p.fw.includes('ae79616f'))) ? `<div class="f-glyph" style="margin-bottom:10px">⚠️ 预览基于固件 <code>1.0.0+ae79616f</code>，目标平板固件为 <code>1.0.0+3e6e51ed</code>，画面可能有细微差异。</div>` : ''}
        ${renderEmbeddedPanelPreview(snap.labCopy, S.previewLayout, `待发布快照 ${snap.snapId}`, true)}
      </div>
    </div>`;
  }

  return `
    <div class="crumb">
      <span><button type="button" class="link-btn" onclick="window.__nav('labs')">实验室管理</button> / <span id="crumb-lab-name">${esc(lab.name)}</span> (${esc(lab.code)})</span>
      <span id="dirty-indicator">${S.isDirty ? '<span class="pill busy"><i></i>有未保存的修改</span>' : `<span class="mono" style="color:var(--muted)">已保存清单版本 v${committedLab.manifest_version}</span>`}</span>
    </div>
    <div class="page-hd">
      <h1><span id="hd-lab-name">${esc(lab.name)}</span> <span style="font-size:14px;font-weight:400;color:var(--muted)">${esc(lab.code)}</span></h1>
      <button type="button" class="btn" onclick="window.__nav('labs')">← 返回列表</button>
    </div>
    <div class="tabs" role="tablist">
      ${[['basic','1. 基本信息'],['equip',`2. 设备组合 (${committedLab.equipIds.length}/60)`],['media','3. 媒体素材'],['publish','4. 预览与发布']].map(([k,t]) =>
        `<button type="button" role="tab" aria-selected="${S.editLabTab===k}" class="tab ${S.editLabTab===k?'active':''}" onclick="window.__setLabTab('${k}')">${t}</button>`).join('')}
    </div>
    ${tabBody}`;
}

  const ro = !canEdit();
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px;flex-wrap:wrap">
      <span style="font-size:12.5px;color:var(--muted)">图片自动裁剪为 Baseline JPEG；视频兼容要求严格含 <strong>MP4 封装 + H.264 无 B 帧</strong>（MOV/MKV/AVI 均自动重封或转码）。</span>
      ${!ro ? `<div style="display:flex;gap:8px">
        <button type="button" class="btn sm" onclick="window.__simDedupUpload()">模拟上传重复文件（sha256 去重）</button>
        <button type="button" class="btn sm pri" onclick="window.__simNewVideoUpload()">+ 上传视频素材</button>
      </div>` : ''}
    </div>
    <div class="media-grid" style="margin-bottom:16px">
      <div style="border:1px solid var(--line);border-radius:8px;padding:12px">
        <div style="font-weight:600;font-size:13px;margin-bottom:8px">封面图（限 1 张 · 800×450）</div>
        <div style="display:flex;align-items:center;gap:12px">
          <div class="thumb-card" style="background:#1D3B58"><span>封面 Baseline JPG<br>800×450</span></div>
          ${!ro ? `<div style="display:flex;flex-direction:column;gap:6px">
            <button type="button" class="btn sm" onclick="window.__notify('已更新封面并自动裁剪为 800×450 Baseline JPEG')">更换封面</button>
            <button type="button" class="btn sm danger" onclick="window.__notify('已解除封面与当前对象的关联')">删除关联</button>
          </div>` : ''}
        </div>
      </div>
      <div style="border:1px solid var(--line);border-radius:8px;padding:12px">
        <div style="font-weight:600;font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between">
          <span>画廊图片（3 / 12 · 可拖动调整顺序）</span>
          ${!ro ? `<button type="button" class="link-btn" onclick="window.__notify('已添加画廊图片（自动缩放至 ≤800×800）')">+ 上传图片</button>` : ''}
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${['主机全景 01','液压夹具 02','测控柜 03'].map((t,i)=>`<div class="thumb-card" style="background:${['#223D54','#2B433B','#3B324B'][i]}"><span>${t}</span></div>`).join('')}
        </div>
      </div>
    </div>
    <div style="border:1px solid var(--line);border-radius:8px;padding:12px">
      <div style="font-weight:600;font-size:13px;margin-bottom:10px">3D 演示视频 & 介绍视频（5 种流水线状态）</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="tr-row">
          <div><strong>waw1000d_3d_section.mp4</strong> <span class="mono" style="color:var(--muted);margin-left:8px">MP4 · 1280×720 · 00:38 · 19.2 MB</span></div>
          <div class="ops"><span class="pill idle"><i></i>兼容</span><button type="button" class="link-btn" onclick="window.__previewVideoModal('waw1000d_3d_section.mp4')">播放</button>${!ro?`<button type="button" class="link-btn del" onclick="window.__notify('已解除视频关联')">删除</button>`:''}</div>
        </div>

function finalizePanelCommit(panel, snap, jobId, extraLog){
  panel.committedLabId = snap.labId;
  panel.committedVer = snap.version;
  panel.committedSha = snap.sha;
  panel.committedSnapshot = JSON.parse(JSON.stringify(snap.labCopy));
  const j = DB.publishJobs.find(x => x.id === jobId);
  if(j){ j.status = '成功'; j.logs.push(extraLog); }
}

window.__runPublish = labId => {
  if(!canEdit()) return;
  const lab = DB.labs.find(x => x.id === labId);
  const panel = panelOfLab(labId);
  const snap = ensurePublishSnapshot(lab, false);
  if(isSnapshotStale(lab, snap).stale){ notify('快照已过期，请先刷新快照', 'err'); render(); return; }

  const jobId = 'PJ-' + (110 + DB.publishJobs.length);
  const forceParam = snap.rebindFromLabId ? `?action=commit&force=1&expected_lab_id=${snap.rebindFromLabId}` : '?action=commit';

  if(S.pubCase === 'transcoding'){
    S.pubStateByLab[labId] = {jobId, snapId:snap.snapId, targetPanelId:panel.id, running:false, status:'idle', progress:25, text:'已锁定快照进入排队：待转码完成后自动推送（若期间换绑将自动阻断）'};
    DB.publishJobs.unshift({id:jobId, time:'2026-11-18 17:06', labId, lab:lab.name, panelId:panel.id, panel:panel.name, ver:'v'+snap.version, snapId:snap.snapId, files:'等待转码', dur:'—', status:'排队', user:S.role, logs:[`[17:06:00] 锁定快照 ${snap.snapId} (binding_rev=${snap.bindingRev}) 排队等待转码`]});
    notify('已锁定快照并加入等待队列'); render(); return;
  }

  DB.publishJobs.unshift({id:jobId, time:'2026-11-18 17:06', labId, lab:lab.name, panelId:panel.id, panel:panel.name, ver:'v'+snap.version, snapId:snap.snapId, files:'3 个 / 38.4 MB', dur:'进行中', status:'传输中', user:S.role, logs:[`[17:06:01] 冻结快照 ${snap.snapId}，目标平板 ${panel.name}`]});
  S.pubStateByLab[labId] = {jobId, snapId:snap.snapId, targetPanelId:panel.id, running:true, status:'running', progress:52, text:'步骤 1/3：上传新增素材 2/3（24.1 / 38.4 MB）…'};
  render();

  setTimeout(() => {
    const job = DB.publishJobs.find(x => x.id === jobId);
    if(S.pubCase === 'netdrop'){
      S.pubStateByLab[labId] = {jobId, snapId:snap.snapId, targetPanelId:panel.id, running:false, status:'failed', progress:65, text:'上传第 3/3 个文件时网络超时（尚未发 commit，平板保持旧清单）'};
      if(job){ job.status = '失败'; job.dur = '9.2 s'; job.err = '上传第 3/3 文件超时'; job.logs.push('[17:06:09] upload 3/3 timeout -> 平板未提交，保留旧清单'); }
      notify(`发布失败（任务 ${jobId}）：上传阶段网络中断`, 'err');
      render(); return;
    }

    S.pubStateByLab[labId].progress = 85;
    S.pubStateByLab[labId].text = `步骤 2/3：发送 POST ${forceParam} → 等待 UI 切换后清理旧素材…`;
    render();

    setTimeout(() => {
      if(S.pubCase === 'commit_lost'){
        /* Panel actually persisted manifest, but HTTP response was lost! */
        panel.committedLabId = snap.labId;
        panel.committedVer = snap.version;
        panel.committedSha = snap.sha;
        panel.committedSnapshot = JSON.parse(JSON.stringify(snap.labCopy));
        S.pubStateByLab[labId] = {jobId, snapId:snap.snapId, targetPanelId:panel.id, running:false, status:'unverified', progress:92, text:'commit 回包丢失：平板可能已落盘新清单，状态标为「待核验」，请回读 info 确认'};
        if(job){ job.status = '待核验'; job.dur = '15.0 s'; job.err = 'commit 回包超时，待 GET info 回读确认'; job.logs.push(`[17:06:15] POST ${forceParam} 回包超时 → 进入待核验态`); }
        notify(`任务 ${jobId} 进入「待核验」状态：请点击回读核验确认屏幕实际版本`, 'err');
        render(); return;
      }

      finalizePanelCommit(panel, snap, jobId, `[17:06:08] POST ${forceParam} → 200 ok (UI 切换完成后清理旧素材) → GET info 三元组核验通过`);
      if(job) job.dur = '7.1 s';
      S.pubStateByLab[labId] = {jobId, snapId:snap.snapId, targetPanelId:panel.id, running:false, status:'done', progress:100, text:`✅ 发布完成！GET info 已确认 (${snap.labId}, v${snap.version}, ${snap.sha.slice(0,8)})`};
      notify(`已成功发布快照 ${snap.snapId} 至「${panel.name}」`);
      render();
    }, 520);
  }, 600);
};

window.__retryPublish = (labId, jobId) => {
  if(!canEdit()) return;
  const lab = DB.labs.find(x => x.id === labId);
  const panel = panelOfLab(labId);
  const snap = S.pubSnapshots[labId] || ensurePublishSnapshot(lab, false);

function renderBindWizardModal(){

  </div>`;

  let body = '';
  let nextBlocked = false;
  if(wiz.step === 1){
    body = `<div class="form-grid">
      <div class="f-item"><label class="f-lbl">平板 IP 地址（已探测 info）</label><input class="inp mono" value="${esc(wiz.ip)}" oninput="window.__wizInput('ip',this.value)"></div>

      <div class="f-item"><label class="f-lbl">序列号 SN</label><input class="inp mono" value="${esc(wiz.sn)}" readonly></div>
      <div class="f-item"><label class="f-lbl">演示设备密码状态 (info.default_password)</label>
        <select class="sel" onchange="window.__wizSet('isDefaultPwd',this.value==='true')">
          <option value="true" ${wiz.isDefaultPwd?'selected':''}>出厂默认密码 (true → 必须改密)</option>
          <option value="false" ${!wiz.isDefaultPwd?'selected':''}>已改密平板 (false → 需输入现有设备密码)</option>
        </select>
      </div>
    </div>`;
  } else if(wiz.step === 2){
    if(wiz.isDefaultPwd){
      if(wiz.pwdMode === 'manual' && wiz.manualPwd.trim().length < 8) nextBlocked = true;
      body = `<div class="f-glyph" style="margin-bottom:12px">🔒 检测到出厂默认密码，绑定前必须改密；改密前后台先持久化加密 <code>pending_password</code>，若回包超时重试可自动用新旧密码探测恢复。</div>
        <div style="display:flex;flex-direction:column;gap:10px">

        </div>`;
    } else {
      if(!wiz.existingPwd.trim()) nextBlocked = true;
      body = `<div class="f-glyph" style="margin-bottom:12px">🔑 该平板已修改过出厂密码（<code>default_password: false</code>），请输入现有设备密码通过 <code>X-Device-Auth</code> 鉴权后方可登记。</div>
        <div class="f-item">
          <label class="f-lbl f-req">现有设备密码（必填，未填写禁止进入下一步）</label>
          <input class="inp" type="password" placeholder="输入该平板当前设备密码（演示任意非空字符）" value="${esc(wiz.existingPwd)}" oninput="window.__wizSet('existingPwd',this.value)">
        </div>`;
    }
  } else if(wiz.step === 3){
    const chosenPanel = wiz.labId ? panelOfLab(wiz.labId) : null;
    if(!wiz.labId || chosenPanel) nextBlocked = true;

          <div style="margin-top:8px;display:flex;align-items:center;justify-content:space-between">
            <strong>${esc(d.name)}</strong>
            <span class="pill neutral">${d.orientation==='portrait'?'竖屏':'横屏'}</span>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(d.desc)}</div>
        </button>`).join('')}
      </div>`;
  }

  openModal('平板绑定向导（4 步完成鉴权/改密、冲突校验与首次发布）', headBar + body, `
    ${wiz.step > 1 ? `<button type="button" class="btn" onclick="window.__wizStep(-1)">上一步</button>` : `<button type="button" class="btn" onclick="window.__closeModal()">取消</button>`}
    ${wiz.step < 4 ? `<button type="button" class="btn pri" ${nextBlocked?'disabled':''} onclick="window.__wizStep(1)">下一步</button>`
      : `<button type="button" class="btn pri" onclick="window.__completeBindWizard()">完成并首次发布</button>`}`, true);
}

  confirmBox('确认重启门口平板', `将向平板「${esc(p.name)} (${p.ip})」发送 <code>reboot</code> 指令，屏幕将短暂黑屏约 8 秒后恢复。是否确认重启？`, '确认重启', () => notify(`重启指令已发送至 ${p.ip}`));
};
window.__unbindPanel = id => {
  const p = DB.panels.find(x => x.id === id);
  confirmBox('确认解绑平板', `解绑平板「${esc(p.name)}」后，平板当前已下发的画面会保留（<code>committedLabId=${p.committedLabId||'无'} v${p.committedVer||0}</code>），后续换绑新实验室时首次发布将走显式替换流程。是否确认解绑？`, '确认解绑', () => {
    p.labId = ''; p.bindingRev++; notify('已解绑平板（旧画面保留在屏上，后续换绑将显式替换）'); render();
  });
};
window.__deletePanel = id => {
  const p = DB.panels.find(x => x.id === id);
  confirmBox('确认删除平板记录', `将从后台移除平板「${esc(p.name)}（${p.sn}）」，是否确认？`, '确认删除', () => {
    DB.panels = DB.panels.filter(x => x.id !== id); notify('已删除平板记录'); render();
  });
};

window.__cleanOrphanMedia = () => { DB.mediaLib = DB.mediaLib.filter(m => !m.refs.includes('未关联')); notify('已清理未引用的孤儿媒体文件'); render(); };
window.__runBackupNow = () => { DB.backups.unshift({id:'B'+Date.now(),name:'labComputer-backup-manual.zip',time:'2026-11-18 17:09',size:'185.1 MB',kind:'手动备份 (admin)'}); notify('后台备份任务已完成'); render(); };
window.__restoreBackup = id => {
  const b = DB.backups.find(x => x.id === id);
  confirmBox('确认从备份恢复', `从「${esc(b.name)}」恢复将覆盖当前数据库并自动重启 Windows 服务。是否继续？`, '确认恢复并重启', () => notify('服务正在恢复并重启…'));
};

window.__openJobLog = id => {
  const j = DB.publishJobs.find(x => x.id === id);
  openModal(`发布任务分步日志 · ${j.id} (${esc(j.lab)})`, `
    <div style="background:#0F172A;color:#E2E8F0;border-radius:8px;padding:14px;font:12.5px/1.7 var(--f-mono)">
      ${j.logs.map(l => `<div style="color:${l.includes('失败')||l.includes('超时')?'#FCA5A5':'#CBD5E1'}">${esc(l)}</div>`).join('')}
    </div>`, `<button type="button" class="btn pri" onclick="window.__closeModal()">关闭</button>`);
};
window.__retryJob = id => {
  if(!canEdit()) return;
  const j = DB.publishJobs.find(x => x.id === id);
  j.status = '成功'; j.err = ''; j.logs.push('[17:10:00] 按任务 ID 断点续传重试成功，已跳过已传文件并完成回读核验');
  const p = DB.panels.find(x => x.id === j.panelId);
  const l = DB.labs.find(x => x.id === j.labId);
  if(p && l){ p.committedLabId = l.id; p.committedVer = l.manifest_version; p.committedSha = computeSha(l); p.committedSnapshot = makeSnapCopy(l); }
  notify(`任务 ${id} 重试成功`); render();
};
window.__verifyJob = id => {
  if(!canEdit()) return;
  const j = DB.publishJobs.find(x => x.id === id);
  j.status = '成功'; j.err = ''; j.logs.push('[17:10:15] GET info 回读三元组匹配目标快照 → 幂等收敛为成功');
  notify(`任务 ${id} 回读核验确认成功`); render();
};

window.__openAuditDiff = id => {
  const a = DB.audits.find(x => x.id === id);
  openModal(`审计日志修改前后对比 · ${esc(a.target)}`, `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div><div style="font-weight:600;margin-bottom:6px;color:var(--txt-maint)">修改前 (Before)</div><pre style="margin:0;padding:12px;border-radius:6px;background:#FEF2F2;font:12px/1.5 var(--f-mono);white-space:pre-wrap">${esc(a.before)}</pre></div>
      <div><div style="font-weight:600;margin-bottom:6px;color:var(--txt-idle)">修改后 (After)</div><pre style="margin:0;padding:12px;border-radius:6px;background:#F0FDF4;font:12px/1.5 var(--f-mono);white-space:pre-wrap">${esc(a.after)}</pre></div>
    </div>`, `<button type="button" class="btn pri" onclick="window.__closeModal()">关闭</button>`);
};

/* Top Review Bar Listeners */
document.getElementById('revRole').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  S.role = b.dataset.v;
  document.querySelectorAll('#revRole button').forEach(x => x.classList.toggle('on', x === b));
  if(!isAdmin() && ['users','audit','backups','settings'].includes(S.route)) S.route = 'overview';
  notify(`已切换为「${b.textContent}」视角，无权限菜单与按钮已按规格直接隐藏`);
  render();
});
document.getElementById('revMode').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  S.mode = b.dataset.v; S.setupStep = 1;
  document.querySelectorAll('#revMode button').forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.getElementById('revPubCase').addEventListener('change', e => {
  S.pubCase = e.target.value;
  S.mode = 'app';
  navigate('lab-edit', {editLabId: S.editLabId || 'L1', editLabTab:'publish'});
});

render();
})();
</script>
</body>
</html>
